<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EWS 3D">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="theme-color" content="#0c1410">
<title>Equestrian Wasteland Sim (EWS) — 3D Client</title>
<script>
window.simSpeed = 1;
window.isWalking = false;
window.camMode = 'iso';
window.bodyMeshes = [];
window._ewsBootReady = false;
window._ewsBootError = null;
window.onerror = function(msg, url, line) {
  if (typeof window._ewsShowBootError === 'function') {
    window._ewsShowBootError(String(msg), line || 0);
  }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root {
  --m: 12px;
  --mi: 60px;
  --fg: #eaf3ec;
  --gl: rgba(20, 32, 26, 0.72);
  --gb: rgba(255, 255, 255, 0.18);
  --ac: #7fc2a5;
  --t: calc(env(safe-area-inset-top, 0px) + var(--m));
  --b: calc(env(safe-area-inset-bottom, 0px) + var(--m));
  --l: calc(env(safe-area-inset-left, 0px) + var(--m));
  --r: calc(env(safe-area-inset-right, 0px) + var(--m));
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  overflow: hidden; background: #0c1410; color: var(--fg);
  font: 13px system-ui, -apple-system, sans-serif;
  touch-action: none; overscroll-behavior: none;
  user-select: none; -webkit-user-select: none;
}
#vp { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; }

.gl {
  background: var(--gl);
  -webkit-backdrop-filter: blur(16px) saturate(1.4);
  backdrop-filter: blur(16px) saturate(1.4);
  border: 1px solid var(--gb);
}

.orb { position: fixed; width: 48px; height: 48px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 17px; z-index: 20; color: var(--fg); cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.5); line-height: 1; user-select: none; }
.orb.on { border-color: var(--ac); box-shadow: 0 0 0 2px var(--ac) inset, 0 0 14px rgba(127,194,165,0.4); }
.orb .orb-lbl { font-size: 7.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.4px; margin-top: 1.5px; opacity: 0.92; pointer-events: none; color: #bfe8d4; }

#boot-err {
  position: fixed;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  width: min(90vw, 560px);
  max-height: 22vh;
  overflow: auto;
  background: rgba(120, 22, 22, 0.94);
  color: #fff;
  padding: 12px 14px 10px 14px;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 12px;
  z-index: 99999;
  font: 13px system-ui;
  box-shadow: 0 12px 28px rgba(0,0,0,0.35);
  display: none;
}
#boot-err.show { display: block; }
#boot-err-close {
  position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: white; font-size: 16px; cursor: pointer;
}
#boot-err b { display: block; margin-right: 30px; }
#boot-err small { opacity: 0.9; }
</style>
</head>
<body data-es="LIVE">
<canvas id="vp"></canvas>
<div id="boot-err" aria-live="polite">
  <button id="boot-err-close" aria-label="Dismiss startup error">×</button>
  <b>Startup Alert</b>
  <div id="boot-err-text">Loading</div>
  <small>Wi‑Fi is required to load Three.js r128.</small>
</div>

<script>
(function() {
  function showBootError(msg, line) {
    var box = document.getElementById('boot-err');
    var text = document.getElementById('boot-err-text');
    if (!box || !text) return;
    text.innerHTML = '<div><strong>Script error:</strong> ' + String(msg) + ' (line ' + line + ')</div>';
    box.classList.add('show');
  }
  window._ewsShowBootError = showBootError;
  document.getElementById('boot-err-close').addEventListener('click', function() {
    document.getElementById('boot-err').classList.remove('show');
  });
})();

window.addEventListener('load', function() {
  if (typeof THREE === 'undefined') {
    window._ewsShowBootError('THREE is not defined', 0);
    return;
  }
  window._ewsBootReady = true;
  document.getElementById('boot-err').classList.remove('show');
});
</script>

<script>
(function() {
  const bootWait = setInterval(function() {
    if (typeof THREE === 'undefined') return;
    clearInterval(bootWait);
    if (!window.__EWS_BOOTSTRAPPED) {
      window.__EWS_BOOTSTRAPPED = true;
      try {
        const stage = document.createElement('script');
        stage.textContent = `
          const $ = id => document.getElementById(id);
          const cv = $('vp');
          const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: 'high-performance' });
          renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
          renderer.setSize(window.innerWidth, window.innerHeight);
          renderer.localClippingEnabled = true;
          renderer.shadowMap.enabled = true;
          const scene = new THREE.Scene();
          scene.background = new THREE.Color(0x18261e);
          const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 150);
          let camMode = 'iso';
          let camTarget = new THREE.Vector3(0, 1.05, 0);
          let camAngle = { yaw: Math.PI * 0.75, pitch: 0.45, dist: 4.8 };
          const ambient = new THREE.AmbientLight(0xffffff, 0.7);
          scene.add(ambient);
          const hemi = new THREE.HemisphereLight(0xdcf2e4, 0x223628, 0.65);
          scene.add(hemi);
          const dir = new THREE.DirectionalLight(0xfff4d6, 1.1);
          dir.position.set(5, 8, 4);
          scene.add(dir);
          function updateCameraPosition() {
            const D = camAngle.dist;
            camera.position.set(
              camTarget.x + D * Math.cos(camAngle.pitch) * Math.sin(camAngle.yaw),
              camTarget.y + D * Math.sin(camAngle.pitch),
              camTarget.z + D * Math.cos(camAngle.pitch) * Math.cos(camAngle.yaw)
            );
            camera.lookAt(camTarget);
          }
          updateCameraPosition();
          const geometry = new THREE.SphereGeometry(0.55, 24, 20);
          const material = new THREE.MeshStandardMaterial({ color: 0xe9e1d9, roughness: 0.8, metalness: 0.05 });
          const body = new THREE.Mesh(geometry, material);
          body.position.y = 0.9;
          scene.add(body);
          function renderLoop() {
            requestAnimationFrame(renderLoop);
            body.rotation.y += 0.006;
            renderer.render(scene, camera);
          }
          renderLoop();
        `;
        document.body.appendChild(stage);
      } catch (e) {
        window._ewsShowBootError(e && e.message ? e.message : 'Unknown boot error', 0);
      }
    }
  }, 50);
})();
</script>
</body>
</html>
