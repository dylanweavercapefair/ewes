<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EWS 3D">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="theme-color" content="#0c1410">
<title>Equestrian Wasteland Sim (EWS) — 3D Client</title>
<style>
:root {
  --m: 12px;
  --mi: 60px;
  --fg: #eaf3ec;
  --gl: rgba(20, 32, 26, 0.72);
  --gb: rgba(255, 255, 255, 0.18);
  --ac: #7fc2a5;
  --t: calc(env(safe-area-inset-top, 0px) + var(--m));
  --b: calc(env(safe-area-inset-bottom, 0px) + var(--m));
  --l: calc(env(safe-area-inset-left, 0px) + var(--m));
  --r: calc(env(safe-area-inset-right, 0px) + var(--m));
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  overflow: hidden; background: #0c1410; color: var(--fg);
  font: 13px system-ui, -apple-system, sans-serif;
  touch-action: none; overscroll-behavior: none;
  user-select: none; -webkit-user-select: none;
}
#vp { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; }
.gl { background: var(--gl); -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4); border: 1px solid var(--gb); }
.orb {
  position: fixed; width: 48px; height: 48px; border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 17px; z-index: 20; color: var(--fg); cursor: pointer;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5); line-height: 1; user-select: none;
}
.orb.on { border-color: var(--ac); box-shadow: 0 0 0 2px var(--ac) inset, 0 0 14px rgba(127,194,165,0.4); }
.orb .orb-lbl {
  font-size: 7.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.4px;
  margin-top: 1.5px; opacity: 0.92; pointer-events: none; color: #bfe8d4;
}
#engine-modes { position: fixed; left: var(--l); top: var(--t); display: flex; flex-direction: column; gap: 6px; z-index: 20; }
#boot-err {
  position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
  width: min(90vw, 560px); max-height: 22vh; overflow: auto;
  background: rgba(120, 22, 22, 0.94); color: #fff; padding: 12px 14px 10px 14px;
  border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; z-index: 99999;
  font: 13px system-ui; box-shadow: 0 12px 28px rgba(0,0,0,0.35); display: none;
}
#boot-err.show { display: block; }
#boot-err-close {
  position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: white; font-size: 16px; cursor: pointer; padding: 0;
}
#boot-err b { display: block; margin-right: 30px; }
#boot-err small { opacity: 0.9; }
#ver-badge {
  position: fixed; right: var(--r); bottom: calc(env(safe-area-inset-bottom, 0px) + 6px);
  padding: 3px 8px; border-radius: 8px; font-size: 10px; font-weight: 800;
  letter-spacing: 0.5px; opacity: 0.85; z-index: 20; color: var(--ac); pointer-events: none;
}
</style>
</head>
<body data-es="LIVE">
<canvas id="vp"></canvas>
<div id="engine-modes">
  <button class="orb gl" id="btn-mode-select" title="Select & Inspect"><span>🎯</span><span class="orb-lbl">SELECT</span></button>
  <button class="orb gl" id="btn-mode-edit" title="Edit Transforms & Nodes"><span>✏️</span><span class="orb-lbl">EDIT</span></button>
  <button class="orb gl" id="btn-mode-build" title="Build & Paint"><span>🔨</span><span class="orb-lbl">BUILD</span></button>
  <button class="orb gl" id="btn-mode-anim" title="Animate & Staging"><span>🎬</span><span class="orb-lbl">ANIM</span></button>
</div>
<div id="ver-badge" class="gl">Build Clean</div>
<div id="boot-err" aria-live="polite">
  <button id="boot-err-close" aria-label="Dismiss startup error">×</button>
  <b>Startup Alert</b>
  <div id="boot-err-text">Initializing...</div>
  <small>Wi‑Fi is required to load Three.js r128.</small>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
  const $ = id => document.getElementById(id);
  function showBootError(msg, line) {
    const box = $('boot-err');
    const text = $('boot-err-text');
    if (!box || !text) return;
    text.innerHTML = '<div><strong>Script error:</strong> ' + String(msg) + (line ? ' (line ' + line + ')' : '') + '</div>';
    box.classList.add('show');
  }
  window._ewsShowBootError = showBootError;
  $('boot-err-close').addEventListener('click', function() {
    $('boot-err').classList.remove('show');
  });
  window.addEventListener('load', function() {
    if (typeof THREE === 'undefined') {
      showBootError('THREE is not defined', 0);
      return;
    }
    try {
      const renderer = new THREE.WebGLRenderer({ canvas: $('vp'), antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x18261e);
      const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 150);
      camera.position.set(2.5, 1.5, 3.5);
      camera.lookAt(0, 1, 0);
      const amb = new THREE.AmbientLight(0xffffff, 0.6); scene.add(amb);
      const dir = new THREE.DirectionalLight(0xfff4d6, 0.8); dir.position.set(5, 8, 4); scene.add(dir);
      const bodyGeo = new THREE.SphereGeometry(0.5, 24, 20);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd0c0a8, roughness: 0.7 });
      const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat); bodyMesh.position.y = 0.9; scene.add(bodyMesh);
      const grid = new THREE.GridHelper(20, 20, 0x2a4434, 0x1c2e23); grid.position.y = 0.005; scene.add(grid);
      function render() { requestAnimationFrame(render); bodyMesh.rotation.y += 0.005; renderer.render(scene, camera); }
      render();
      $('boot-err').classList.remove('show');
    } catch (e) {
      showBootError(e && e.message ? e.message : 'Unknown error', 0);
    }
  });
  setTimeout(function() {
    if (typeof THREE === 'undefined') showBootError('THREE.js CDN timeout', 0);
  }, 5000);
})();
</script>
</body>
</html>
