<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EWS 3D">
<meta name="theme-color" content="#0c1410">
<title>Equestrian Wasteland Sim (EWS) — 3D Client</title>
<script>
window.simSpeed = 1;
window.isWalking = false;
window.camMode = 'iso';
window.bodyMeshes = [];
window.onerror = function(msg, url, line) {
  var d = document.getElementById('boot-err');
  if (!d) {
    d = document.createElement('div');
    d.id = 'boot-err';
    d.style.cssText = 'position:fixed;top:16px;left:16px;right:16px;background:rgba(180,40,40,0.92);color:#fff;padding:14px;border-radius:12px;z-index:99999;font:13px system-ui;backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(0,0,0,0.6)';
    document.body ? document.body.appendChild(d) : document.documentElement.appendChild(d);
  }
  d.innerHTML = '<b>Startup Alert:</b> ' + msg + ' (line ' + line + ')<br><small style="opacity:0.85">If THREE is not defined, ensure Wi-Fi is connected to load Three.js r128.</small>';
};
</script>
<!-- Three.js r128 Core & OrbitControls -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* ===== EWS ZERO-BAR MASTER SHELL LAYOUT LAW =====
   Outer margin (--m = 12px) = critical glass orbs only.
   Inner margin (--mi = 60px) = sliding tool sheets only when summoned.
   100% of the screen is borderless 3D viewport. No persistent top/bottom bars. */
:root {
  --m: 12px;
  --mi: 60px;
  --fg: #eaf3ec;
  --gl: rgba(20, 32, 26, 0.72);
  --gb: rgba(255, 255, 255, 0.18);
  --ac: #7fc2a5;
  --t: calc(env(safe-area-inset-top, 0px) + var(--m));
  --b: calc(env(safe-area-inset-bottom, 0px) + var(--m));
  --l: calc(env(safe-area-inset-left, 0px) + var(--m));
  --r: calc(env(safe-area-inset-right, 0px) + var(--m));
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  overflow: hidden; background: #0c1410; color: var(--fg);
  font: 13px system-ui, -apple-system, sans-serif;
  touch-action: none; overscroll-behavior: none;
  user-select: none; -webkit-user-select: none;
}
#vp { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; }

/* Frosted glass styling */
.gl {
  background: var(--gl);
  -webkit-backdrop-filter: blur(16px) saturate(1.4);
  backdrop-filter: blur(16px) saturate(1.4);
  border: 1px solid var(--gb);
}

/* Corner glass orbs (>=44px touch targets) */
.orb {
  position: fixed; width: 48px; height: 48px; border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 17px; z-index: 20; color: var(--fg); cursor: pointer;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  line-height: 1; user-select: none;
}
.orb.on { border-color: var(--ac); box-shadow: 0 0 0 2px var(--ac) inset, 0 0 14px rgba(127,194,165,0.4); }
.orb .orb-lbl {
  font-size: 7.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.4px;
  margin-top: 1.5px; opacity: 0.92; pointer-events: none; color: #bfe8d4;
}

/* === Mode stack, camera menu, pause/speed pair === */
#btn-mode-select { left: var(--l); top: var(--t); }
#btn-mode-edit   { left: var(--l); top: calc(var(--t) + 56px); }
#btn-mode-build  { left: var(--l); top: calc(var(--t) + 112px); }
#btn-mode-anim   { left: var(--l); top: calc(var(--t) + 168px); }

/* Top-Right Dedicated Controls */
#btn-isolate     { right: var(--r); top: var(--t); display: none; }
#btn-cam-toggle  { right: calc(var(--r) + 56px); top: var(--t); display: none; }
body:not([data-es="LIVE"]) #btn-isolate,
body:not([data-es="LIVE"]) #btn-cam-toggle { display: flex; }

/* Left-margin modeling buttons */
#dock-undo       { left: var(--l); top: calc(var(--t) + 224px); display: none !important; }
#dock-redo       { left: var(--l); top: calc(var(--t) + 276px); display: none !important; }
#btn-margin-reset{ left: var(--l); top: calc(var(--t) + 328px); display: none !important; }
#btn-margin-mirror{ left: var(--l); top: calc(var(--t) + 380px); display: none !important; }
#btn-margin-del  { left: var(--l); top: calc(var(--t) + 432px); display: none !important; }
body[data-es="SELECT"] #dock-undo, body[data-es="SELECT"] #dock-redo, body[data-es="SELECT"] #btn-margin-reset, body[data-es="SELECT"] #btn-margin-mirror, body[data-es="SELECT"] #btn-margin-del,
body[data-es="EDIT"] #dock-undo, body[data-es="EDIT"] #dock-redo, body[data-es="EDIT"] #btn-margin-reset, body[data-es="EDIT"] #btn-margin-mirror, body[data-es="EDIT"] #btn-margin-del,
body[data-es="BUILD"] #dock-undo, body[data-es="BUILD"] #dock-redo, body[data-es="BUILD"] #btn-margin-reset, body[data-es="BUILD"] #btn-margin-mirror, body[data-es="BUILD"] #btn-margin-del,
body[data-es="MODEL"] #dock-undo, body[data-es="MODEL"] #dock-redo, body[data-es="MODEL"] #btn-margin-reset, body[data-es="MODEL"] #btn-margin-mirror, body[data-es="MODEL"] #btn-margin-del {
  display: flex !important;
}

body[data-es="SELECT"] #dock-undo, body[data-es="SELECT"] #dock-redo, body[data-es="SELECT"] #btn-margin-reset, body[data-es="SELECT"] #btn-margin-mirror, body[data-es="SELECT"] #btn-margin-del,
body[data-es="EDIT"] #dock-undo, body[data-es="EDIT"] #dock-redo, body[data-es="EDIT"] #btn-margin-reset, body[data-es="EDIT"] #btn-margin-mirror, body[data-es="EDIT"] #btn-margin-del,
body[data-es="BUILD"] #dock-undo, body[data-es="BUILD"] #dock-redo, body[data-es="BUILD"] #btn-margin-reset, body[data-es="BUILD"] #btn-margin-mirror, body[data-es="BUILD"] #btn-margin-del,
body[data-es="MODEL"] #dock-undo, body[data-es="MODEL"] #dock-redo, body[data-es="MODEL"] #btn-margin-reset, body[data-es="MODEL"] #btn-margin-mirror, body[data-es="MODEL"] #btn-margin-del { display: flex; }

/* Top Geometry Rollout Bar */
#top-geo-bar {
  position: fixed; z-index: 22; left: calc(var(--l) + 120px); top: var(--t);
  display: none; align-items: center; gap: 6px;
}
body[data-es="BUILD"] #top-geo-bar,
body[data-es="EDIT"] #top-geo-bar,
body[data-es="MODEL"] #top-geo-bar { display: flex; }
#geo-rollout {
  display: none; gap: 5px; overflow-x: auto; padding: 4px 8px; border-radius: 14px;
  background: rgba(14,26,20,0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(160,230,200,0.25); max-width: calc(100vw - 360px);
}
#geo-rollout.open { display: flex; }

/* Bottom Bar & Popover snug to bottom */
#bbar { position: fixed; z-index: 25; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 4px); display: none !important; gap: 6px; }
body[data-es="SELECT"] #bbar,
body[data-es="EDIT"] #bbar,
body[data-es="BUILD"] #bbar,
body[data-es="MODEL"] #bbar { display: flex !important; }
body[data-es="LIVE"] #bbar,
body:not([data-es]) #bbar { display: none !important; }
.bbb { height: 28px; padding: 0 12px; border-radius: 14px; border: 1px solid rgba(160,230,200,0.25); background: rgba(14,26,20,0.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: #bfe8d4; font: 700 11px system-ui; letter-spacing: 1px; text-transform: uppercase; opacity: 0.85; cursor: pointer; }
#bb-pop { position: fixed; z-index: 26; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 36px); display: none; flex-wrap: wrap; gap: 5px; justify-content: center; max-width: min(92vw, 540px); max-height: 48vh; overflow-y: auto; padding: 8px; border-radius: 14px; background: rgba(14,26,20,0.88); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(160,230,200,0.25); }
#bb-pop.open { display: flex; }
.bbi { height: 32px; padding: 0 10px; border-radius: 10px; border: 1px solid rgba(160,230,200,0.2); background: rgba(255,255,255,0.06); color: #dff5ea; font: 600 11.5px system-ui; cursor: pointer; white-space: nowrap; }
.bbi.on { background: rgba(127,194,165,0.35); border-color: #7fc2a5; }

/* Bottom Right Build Version Badge */
#ver-badge {
  position: fixed; right: var(--r); bottom: calc(env(safe-area-inset-bottom, 0px) + 6px);
  padding: 3px 8px; border-radius: 8px; font-size: 10px; font-weight: 800;
  letter-spacing: 0.5px; opacity: 0.85; z-index: 20; color: var(--ac); pointer-events: none;
}
body[data-es]:not([data-es="LIVE"]) #rag { display: none !important; }
#view-sub-menu .ctrl { 
  width: 58px; height: 48px; padding: 2px 4px; font-size: 15px; 
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
#view-sub-menu .ctrl .ctrl-lbl {
  font-size: 7.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.3px;
  margin-top: 2px; opacity: 0.92; color: #bfe8d4;
}
/* pause + speed now live ONLY in the revolver hub (tap clock = pause, tap speed tag) */
#mode, #time { display: none !important; }
/* tool flyout: 3 small gizmo buttons beside EDIT / BUILD orb */
#tool-fly { position: fixed; z-index: 21; width: 0; height: 0; left: calc(var(--l) + 24px); pointer-events: none; }
#tool-fly.at-edit { top: calc(var(--t) + 80px); }
#tool-fly.at-build { top: calc(var(--t) + 136px); }
#tool-fly .tf { position: absolute; left: -16px; top: -16px; width: 32px; height: 32px; font-size: 15px; opacity: 0; pointer-events: none;
  transform: translate(0, 0) scale(0.3); transition: transform .26s cubic-bezier(.2,.9,.2,1), opacity .18s, border-color .15s; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
#tool-fly.show .tf { opacity: 1; pointer-events: auto; }
#tool-fly.show #tf-translate { transform: translate(29px, -30px) scale(1); }
#tool-fly.show #tf-rotate { transform: translate(42px, 0) scale(1); }
#tool-fly.show #tf-scale { transform: translate(29px, 30px) scale(1); }
#time { right: var(--r); bottom: var(--b); }
#mode { left: auto; right: calc(var(--r) + 56px); bottom: var(--b); }
#sub  { right: var(--r); top: var(--t); }
#rev-hub { touch-action: none; }
#btn-iso-exit { right: var(--r); top: calc(var(--t) + 56px); }
body.iso #btn-iso-exit { display: flex !important; }

/* Draggable Dynamic Multi-Ring Revolver UI (Compact with Clear Text Labels & Snug Circles) */
#revolver {
  position: fixed; z-index: 30; width: 380px; height: 380px;
  touch-action: none; pointer-events: none;
}
#rev-hub {
  position: absolute; left: 164px; top: 164px; width: 52px; height: 52px;
  border-radius: 50%; background: rgba(10, 24, 18, 0.94);
  border: 1.5px solid #3fa56b;
  box-shadow: 0 0 14px rgba(64, 255, 128, 0.35), inset 0 0 10px rgba(0, 0, 0, 0.85);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: grab; color: #50ff70; font-family: ui-monospace, monospace;
  text-shadow: 0 0 5px rgba(80, 255, 112, 0.85); z-index: 12; pointer-events: auto;
  user-select: none; transition: border-color 0.2s, box-shadow 0.2s;
}
#rev-hub:active { cursor: grabbing; }
#rev-hub.paused {
  border-color: #ffaa33;
  box-shadow: 0 0 14px rgba(255, 170, 51, 0.55), inset 0 0 10px rgba(0, 0, 0, 0.85);
  color: #ffbb44;
  text-shadow: 0 0 5px rgba(255, 187, 68, 0.85);
}
#rev-clock { font-size: 10.5px; font-weight: 700; letter-spacing: 0.3px; line-height: 1; pointer-events: auto; }
#rev-hub-bar {
  display: flex; align-items: center; gap: 2px; margin-top: 2px;
}
#rev-state {
  font-size: 6.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.2px; opacity: 0.92;
}
#rev-speed-tag {
  font-size: 6.5px; font-weight: 800; padding: 1px 3px; border-radius: 4px;
  background: rgba(127,194,165,0.25); color: #bfe8d4; border: 1px solid rgba(127,194,165,0.4);
  cursor: pointer; pointer-events: auto; line-height: 1;
}
.rev-satellite {
  position: absolute; left: 179px; top: 179px; width: 22px; height: 22px; border-radius: 50%;
  background: var(--gl); border: 1px solid var(--gb); color: var(--fg);
  display: flex; align-items: center; justify-content: center; font-size: 11px;
  cursor: pointer; pointer-events: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  transition: transform 0.22s cubic-bezier(0.2, 0.9, 0.2, 1), background 0.15s, border-color 0.15s;
  z-index: 15; user-select: none;
}
.rev-satellite:hover { background: rgba(127,194,165,0.25); border-color: var(--ac); }
.bullet {
  position: absolute; left: 172px; top: 172px; width: 36px; height: 36px; border-radius: 50%;
  background: var(--gl); border: 1px solid var(--gb); color: var(--fg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 5; transition: transform 0.22s cubic-bezier(0.2, 0.9, 0.2, 1), background 0.15s, border-color 0.15s;
  cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  line-height: 1; user-select: none; pointer-events: auto;
}
.bullet.folder-bullet {
  background: rgba(26, 44, 36, 0.94); border-color: #50ff70;
}
.bullet.folder-open {
  border-color: var(--ac); box-shadow: 0 0 0 1.5px var(--ac) inset, 0 0 12px rgba(127,194,165,0.7);
  background: rgba(40, 75, 58, 0.98);
}
.bullet.outer-ring, .bullet.layer-2 {
  width: 32px; height: 32px; left: 174px; top: 174px;
  background: rgba(14, 26, 20, 0.94); border-color: rgba(127,194,165,0.55);
  z-index: 6;
}
.bullet.layer-3 {
  width: 30px; height: 30px; left: 175px; top: 175px;
  background: rgba(20, 38, 30, 0.96); border: 1.5px solid #50ff70;
  box-shadow: 0 0 8px rgba(80, 255, 112, 0.35), 0 2px 8px rgba(0,0,0,0.5);
  z-index: 7;
}
.bullet .bullet-ico { font-size: 13px; line-height: 1; }
.bullet.layer-2 .bullet-ico { font-size: 11px; }
.bullet.layer-3 .bullet-ico { font-size: 10px; }
.bullet .bullet-lbl {
  font-size: 6.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.2px;
  margin-top: 1.5px; opacity: 0.95; pointer-events: none; max-width: 32px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; color: #bfe8d4;
  display: block; line-height: 1;
}
.bullet.layer-2 .bullet-lbl { font-size: 6px; max-width: 28px; }
.bullet.layer-3 .bullet-lbl { font-size: 5.5px; max-width: 26px; color: #a3f7c5; }
.bullet.on { border-color: var(--ac); box-shadow: 0 0 0 1.5px var(--ac) inset, 0 0 10px rgba(127,194,165,0.5); }
.bullet.btn-add {
  background: rgba(47, 143, 106, 0.4); border-color: #7fc2a5; color: #7fc2a5;
}
/* revolver wheel: every ring shares the same 8 spoke angles; empty slots show as dim chambers */
.bullet { transition: transform .34s cubic-bezier(.2,.9,.2,1), opacity .24s, background .15s, border-color .15s; }
.chamber {
  position: absolute; left: 184px; top: 184px; width: 12px; height: 12px; border-radius: 50%;
  border: 1px dashed rgba(127,194,165,0.38); background: rgba(0,0,0,0.28); pointer-events: none; z-index: 4;
  transition: transform .34s cubic-bezier(.2,.9,.2,1), opacity .24s;
}
#rev-primer {
  width: 26px; height: 26px; left: 177px; top: 177px; padding: 0;
  background: radial-gradient(circle at 35% 30%, #f3dfa6 0%, #c79a45 48%, #7a5a22 100%);
  border: 1px solid #e8c878;
}
#rev-primer::after {
  content: ''; width: 9px; height: 9px; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #8a6a2c, #4a3512); box-shadow: inset 0 0 2px rgba(0,0,0,.7);
}
#rev-dock { left: var(--l); top: calc(var(--t) + 336px); display: none; }
body.rev-docked #rev-dock, body.rev-dockhint #rev-dock { display: flex; }
body.rev-dockhint:not(.rev-docked) #rev-dock { opacity: .55; }
body.rev-dockhint #rev-dock.on { opacity: 1; border-color: var(--ac); }
body.rev-docked #revolver { display: none; }
.dock-dot { width: 16px; height: 16px; border-radius: 50%; border: 1px solid #e8c878;
  background: radial-gradient(circle at 35% 30%, #f3dfa6 0%, #c79a45 48%, #7a5a22 100%); }

/* Sliding Glass Inspection & Modeler Sheet (Zero-bar law: appears only when summoned) */
#sheet {
  position: fixed; left: calc(var(--l) + var(--mi)); right: calc(var(--r) + var(--mi));
  bottom: calc(var(--b) + 8px); max-height: 48%; border-radius: 20px;
  padding: 12px 16px; display: none; z-index: 40; overflow-y: auto;
  touch-action: pan-y; box-shadow: 0 12px 40px rgba(0,0,0,0.7);
}
#sheet.s { display: block; }
#sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
#sheet-title { font-size: 14px; font-weight: 700; color: var(--ac); }
#sheet-close {
  min-width: 44px; min-height: 44px; border-radius: 50%; border: 1px solid var(--gb);
  background: rgba(255,255,255,0.08); color: var(--fg); font-size: 18px; cursor: pointer;
}
.row { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0; align-items: center; }
.ctrl {
  min-height: 44px; min-width: 44px; border-radius: 10px; border: 1px solid var(--gb);
  background: rgba(255,255,255,0.08); color: var(--fg); padding: 0 12px; font: inherit;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.ctrl.on { background: var(--ac); color: #0c1410; font-weight: 600; border-color: var(--ac); }
label.slider-group {
  display: flex; align-items: center; gap: 10px; flex: 1; min-width: 220px; font-size: 12px;
}
label.slider-group span { min-width: 100px; }
input[type=range] { flex: 1; height: 28px; accent-color: var(--ac); }

/* Cinematic Horizon Bokeh Overlay */
#bokeh-overlay {
  position: fixed; inset: 0; pointer-events: none; z-index: 5; opacity: 0;
  transition: opacity 0.5s ease;
  background: radial-gradient(circle at 50% 120%, transparent 35%, rgba(12,20,16,0.6) 75%, rgba(12,20,16,0.92) 100%);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
#bokeh-overlay.active { opacity: 1; }

/* Toast Notifications */
#toast {
  position: fixed; left: 50%; top: var(--t); transform: translateX(-50%);
  padding: 8px 18px; border-radius: 20px; opacity: 0; transition: opacity 0.3s;
  pointer-events: none; z-index: 100; font-size: 12px; font-weight: 600;
}
#toast.show { opacity: 1; }

#ring-pill {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); z-index: 25;
  display: none; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px;
  max-width: calc(100vw - 150px); padding: 6px;
  background: rgba(20,30,24,0.78); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border: 1px solid var(--gb); border-radius: 14px; color: var(--fg); font-size: 12px; touch-action: none;
}
#ring-pill .ctrl { padding: 0 12px; font-size: 13px; }
#ring-pill .hint { width: 100%; text-align: center; opacity: 0.85; }
details.insp-more > summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; font-weight: 600; color: var(--ac); }

/* FIX: lost layout for left VIEWS menu (was overlapping the mode orbs) */
#left-views { position: fixed; z-index: 21; left: calc(var(--l) + 60px); top: var(--t); display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
#btn-view-toggle { position: static; }
#view-sub-menu { display: none; flex-direction: column; gap: 4px; max-height: calc(100vh - 120px); overflow-y: auto; padding: 4px; border-radius: 14px; background: rgba(14,26,20,0.85); border: 1px solid rgba(160,230,200,0.25); }
#view-sub-menu.open { display: flex; }
#view-sub-menu .ctrl { position: static; }
body[data-es="LIVE"] #engine-modes { display: flex; }
</style>
</head>
<body data-es="LIVE">

<canvas id="vp"></canvas>
<div id="bokeh-overlay"></div>

<!-- Master Engine Modes (Persistent Top-Left Stack) -->
<div id="engine-modes">
  <button class="orb gl" id="btn-mode-select" onclick="setEngineState('SELECT')" title="Select & Inspect"><span>🎯</span><span class="orb-lbl">SELECT</span></button>
  <button class="orb gl" id="btn-mode-edit" onclick="setEngineState('EDIT')" title="Edit Transforms & Nodes"><span>✏️</span><span class="orb-lbl">EDIT</span></button>
  <button class="orb gl" id="btn-mode-build" onclick="window._isoViaOrb=true;setEngineState('BUILD');window._isoViaOrb=false" title="Build & Paint Mining Zones"><span>🔨</span><span class="orb-lbl">BUILD</span></button>
  <button class="orb gl" id="btn-mode-anim" onclick="setEngineState('ANIMATE')" title="Animate & Staging Isolation"><span>🎬</span><span class="orb-lbl">ANIM</span></button>
</div>

<div id="tool-fly">
  <button class="orb gl tf" id="tf-translate" onclick="activateGizmoMode('translate')" title="Move gizmo">✋</button>
  <button class="orb gl tf" id="tf-rotate" onclick="activateGizmoMode('rotate')" title="Rotate gizmo">🔄</button>

function updateCameraPosition() {
  const _D = camAngle.dist * (window.orthoOn ? 8.3 : 1);
  if (camMode === 'iso' || camMode === 'free') {
    camera.position.set(
      camTarget.x + _D * Math.cos(camAngle.pitch) * Math.sin(camAngle.yaw),
      camTarget.y + _D * Math.sin(camAngle.pitch),
      camTarget.z + _D * Math.cos(camAngle.pitch) * Math.cos(camAngle.yaw)
    );
    camera.lookAt(camTarget);
  } else if (camMode === 'chase') {
    const ry = characterGroup.rotation.y, d = Math.min(camAngle.dist, 4.5) * (window.orthoOn ? 8.3 : 1);
    const p = 0.40; // Elevated pitch looking down from above/behind head
    const fwdDist = 1.2;
    const fwdX = Math.cos(ry) * fwdDist, fwdZ = -Math.sin(ry) * fwdDist;
    camera.position.set(
      camTarget.x - Math.cos(ry) * d * Math.cos(p),
      camTarget.y + d * Math.sin(p),
      camTarget.z + Math.sin(ry) * d * Math.cos(p));
    // Look ahead of pony so player sees forward path and area in front
    camera.lookAt(camTarget.x + fwdX * 0.35, camTarget.y - 0.1, camTarget.z + fwdZ * 0.35);
  } else if (camMode === 'cinematic') {
    camera.position.set(camTarget.x + 1.2, camTarget.y + 0.15, camTarget.z + 1.8);
    camera.lookAt(camTarget.x, camTarget.y + 0.9, camTarget.z);
  } else if (camMode === 'slice') {
    camera.position.set(camTarget.x + 3.2, camTarget.y + 0.8, camTarget.z);
    camera.lookAt(camTarget.x, camTarget.y + 0.8, camTarget.z);
  }
}

// === 3. CELESTIAL SUN/MOON & ILLUMINATION ===

const modelKey = new THREE.DirectionalLight(0xffffff, 0.0);

const _mkv = new THREE.Vector3();
function updateModelLight() {
  const es = document.body.getAttribute('data-es') || 'LIVE';
  const on = es !== 'LIVE';
  ambLight.intensity = on ? 0.18 : 0.45;
  hemiLight.intensity = on ? 0.28 : 0.45;
  celestialLight.intensity = on ? 0.35 : 0.9;
  modelKey.intensity = on ? 0.95 : 0.0;
  if (on) {
    _mkv.set(-2.2, 3.0, 1.0).applyQuaternion(camera.quaternion);
    modelKey.position.copy(camera.position).add(_mkv);
    modelKey.target.position.copy(camTarget);
  }
}
const visceraLight = new THREE.PointLight(0x7fc2a5, 1.2, 2.5);
visceraLight.position.set(0.1, 0.8, 0);
scene.add(visceraLight);

// === 4. 200x200 WORLD GRID & TERRAIN FEATURES ===
const GRID_HALF = 100;
const TILE_SIZE = 0.5;

  color: 0x142018,
  roughness: 0.9,
  metalness: 0.05
});
const groundMesh = new THREE.Mesh(gridGeo, gridMat);
groundMesh.receiveShadow = true;
scene.add(groundMesh);

// Dynamic Ground Splat Map (Puddles, Scent Marking & Wetness Persistence)
const splatCanvas = document.createElement('canvas');
splatCanvas.width = splatCanvas.height = 256;
const splatCtx = splatCanvas.getContext('2d');
splatCtx.fillStyle = '#e8e8e8'; // default matte roughness (~0.9)
splatCtx.fillRect(0, 0, 256, 256);

const splatTexture = new THREE.CanvasTexture(splatCanvas);
splatTexture.wrapS = splatTexture.wrapT = THREE.ClampToEdgeWrapping;
gridMat.roughnessMap = splatTexture;
gridMat.needsUpdate = true;

const SCENT_GRID = new Map(); // key: 'gx,gz' -> { tag, intensity, expires }

function addSplat(worldX, worldZ, radius = 0.5, type = 'water', scentTag = null) {
  const u = (worldX + 50) / 100 * 256;
  const v = (worldZ + 50) / 100 * 256;
  const rPx = Math.max(3, radius / 100 * 256);

  splatCtx.save();
  if (type === 'water' || type === 'rain') {
    splatCtx.fillStyle = 'rgba(25, 25, 25, 0.40)'; // reflective puddle
  } else if (type === 'snow') {
    splatCtx.fillStyle = 'rgba(255, 255, 255, 0.65)';
  } else if (type === 'urine' || type === 'scent') {
    splatCtx.fillStyle = 'rgba(50, 42, 12, 0.55)'; // amber scent mark
  } else if (type === 'ejaculate') {
    splatCtx.fillStyle = 'rgba(225, 225, 225, 0.75)'; // viscous droplet
  } else if (type === 'groom_saliva') {
    splatCtx.fillStyle = 'rgba(35, 35, 35, 0.30)'; // damp speckle
  }
  splatCtx.beginPath();
  splatCtx.arc(u, v, rPx, 0, Math.PI * 2);
  splatCtx.fill();
  splatCtx.restore();
  splatTexture.needsUpdate = true;

  if (scentTag) {
    const key = `${Math.round(worldX)},${Math.round(worldZ)}`;
    SCENT_GRID.set(key, { tag: scentTag, intensity: 1.0, expires: performance.now() + 60000 });
  }
}
window.EWS_splat = { addSplat, SCENT_GRID };

// === 5. PHYSICAL CLIPPING PLANE ===
const clipPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 10.0);
renderer.clippingPlanes = []; // Local material clipping only

// === 6. 23-SPHERE RIG ===
const characterGroup = new THREE.Group();

// Soft 4-step toon ramp (flat-ish colour bands, no photoreal shading)
const _toonRamp = (() => {
  // Smooth 64-step gradient: soft toon falloff with NO hard stripes
  const N = 64, d = new Uint8Array(N * 4);
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1);
    const k = t * t * (3 - 2 * t);
    const v = Math.round(62 + 178 * k);   // shadow 62 -> light 240 (deeper so clipping/form reads)
    d[i*4] = d[i*4+1] = d[i*4+2] = v; d[i*4+3] = 255;
  }
  const tex = new THREE.DataTexture(d, N, 1, THREE.RGBAFormat);
  tex.minFilter = tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = false; tex.needsUpdate = true; return tex;
})();
const ponyMat = new THREE.MeshToonMaterial({
  color: 0xd0c0a8,
  gradientMap: _toonRamp,
  clippingPlanes: [clipPlane],
  clipShadows: true,
  side: THREE.DoubleSide
});
ponyMat.roughness = 0.55; // kept so older code that nudges roughness doesn't break


const organMat = new THREE.MeshStandardMaterial({

// === PROCEDURAL TANGENT LOFTS WITH VERTEX NORMAL WELDING (Option A - Zero Seams) ===
// Ring profile: smooth size multiplier along a tube. t: 0 = child end, 1 = parent end.
function _ringProfile(rings, t) {
  if (!rings || !rings.length) return { m: 1, dm: 0 };
  const P = [{ t: 0, k: 1 }, ...rings.slice().sort((a, b) => a.t - b.t), { t: 1, k: 1 }];
  let i = 0;
  while (i < P.length - 2 && t > P[i + 1].t) i++;
  const p0 = P[i], p1 = P[i + 1];
  const h = Math.max(1e-4, p1.t - p0.t);
  const tang = (j) => (j <= 0 || j >= P.length - 1) ? 0 : (P[j + 1].k - P[j - 1].k) / Math.max(1e-4, P[j + 1].t - P[j - 1].t);
  const m0 = tang(i) * h, m1 = tang(i + 1) * h;
  const u = Math.min(1, Math.max(0, (t - p0.t) / h)), u2 = u * u, u3 = u2 * u;
  const m = (2*u3 - 3*u2 + 1) * p0.k + (u3 - 2*u2 + u) * m0 + (-2*u3 + 3*u2) * p1.k + (u3 - u2) * m1;
  const dm = ((6*u2 - 6*u) * p0.k + (3*u2 - 4*u + 1) * m0 + (-6*u2 + 6*u) * p1.k + (3*u2 - 2*u) * m1) / h;
  return { m, dm };
}

function createWeldedLoftGeometry(rP, rC, radSegs = 24, ringDefs = null) {
  // Unit-height tube (+Y end = parent). Radius eases with smoothstep so the tube
  // leaves each sphere exactly tangent to it (zero crease). Normals are the TRUE
  // surface normals of that profile; three.js corrects them for the Y-stretch.
  const rings = (ringDefs && ringDefs.length) ? 28 : 10;
  const pos = [], nor = [], idx = [], uvs = [];
  for (let j = 0; j <= rings; j++) {
    const t = j / rings;                       // 0 = child end, 1 = parent end
    const e = t * t * (3 - 2 * t);             // smoothstep
    const base = rC + (rP - rC) * e;
    const dbase = (rP - rC) * 6 * t * (1 - t); // d(base)/dt (height is 1)
    const rp = _ringProfile(ringDefs, t);
    const r = base * rp.m;
    const dr = dbase * rp.m + base * rp.dm;
    const y = t - 0.5;
    for (let i = 0; i <= radSegs; i++) {
      const a = (i / radSegs) * Math.PI * 2;
      const cx = Math.cos(a), sz = Math.sin(a);
      pos.push(cx * r, y, sz * r);
      const nl = Math.hypot(1, dr);
      nor.push(cx / nl, -dr / nl, sz / nl);
      uvs.push(i / radSegs, t);
    }
  }
  for (let j = 0; j < rings; j++) for (let i = 0; i < radSegs; i++) {
    const a = j * (radSegs + 1) + i, b = a + radSegs + 1;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(idx);
  return geo;
}

// Radius of a rig sphere as seen across a limb (honours its sx/sz squash)
function _sphereCrossR(name, fallback, otherName) {
  const bm = bodyMeshes.find(b => b.name === name);
  const om = bodyMeshes.find(b => b.name === otherName);
  if (!bm) return fallback;
  const r = bm.mesh.geometry.parameters ? bm.mesh.geometry.parameters.radius : fallback;
  const sc = bm.mesh.scale;
  let sa = sc.x, sb = sc.z;                 // default: vertical limb
  if (om) {
    const dx = Math.abs(om.mesh.position.x - bm.mesh.position.x);
    const dy = Math.abs(om.mesh.position.y - bm.mesh.position.y);
    const dz = Math.abs(om.mesh.position.z - bm.mesh.position.z);
    if (dx >= dy && dx >= dz) { sa = sc.y; sb = sc.z; }       // runs front-back
    else if (dz >= dy)        { sa = sc.x; sb = sc.y; }       // runs sideways
  }
  return r * (sa + sb) * 0.5;
}

function initBodyConnectors() {
  while (bodyConnectorGroup.children.length > 0) {
    const c = bodyConnectorGroup.children[0];
    bodyConnectorGroup.remove(c);
    if (c.geometry) c.geometry.dispose();
  }
  bodyConnectors.length = 0;

  CONNECTOR_DEFS.forEach(def => {
    const pMesh = bodyMeshes.find(b => b.name === def.parent);
    const cMesh = bodyMeshes.find(b => b.name === def.child);
    if (pMesh && cMesh) {
      const _slim = (def.parent === 'chest' && def.child === 'head');
      const rPv = _slim ? def.rP : _sphereCrossR(def.parent, def.rP, def.child);
      const rCv = _slim ? def.rC : _sphereCrossR(def.child, def.rC, def.parent);
      const geo = createWeldedLoftGeometry(rPv, rCv, 24, def.rings);
      const mesh = new THREE.Mesh(geo, ponyMat);
      mesh.castShadow = true;
      bodyConnectorGroup.add(mesh);
      bodyConnectors.push({ parent: pMesh, child: cMesh, mesh, def, rPv, rCv });
    }
  });
  updateBodyConnectors();
}

const _upVec = new THREE.Vector3(0, 1, 0);
const _dirVec = new THREE.Vector3();
const _midVec = new THREE.Vector3();

const _refX = new THREE.Vector3(1,0,0), _refZ = new THREE.Vector3(0,0,1), _bx = new THREE.Vector3(), _bz = new THREE.Vector3(), _bm = new THREE.Matrix4();
function updateBodyConnectors() {
  bodyConnectorGroup.visible = bodyConnectorsVisible && ponyMat.visible;
  if (!bodyConnectorGroup.visible) { ringMarker.visible = false; ringGhosts.forEach(g => g.visible = false); return; }

  for (let i = 0; i < bodyConnectors.length; i++) {
    const conn = bodyConnectors[i];
    const pPos = conn.parent.mesh.position;
    const cPos = conn.child.mesh.position;

    _dirVec.subVectors(pPos, cPos); // Vector pointing from child towards parent (+Y)
    const len = _dirVec.length();

    if (len < 0.001) {
      conn.mesh.visible = false;
      continue;
    }

    conn.mesh.visible = bodyConnectorsVisible && ponyMat.visible;
    if (!conn.mesh.visible) continue;

    _dirVec.multiplyScalar(1.0 / len);
    _midVec.addVectors(pPos, cPos).multiplyScalar(0.5);

    conn.mesh.position.copy(_midVec);
    { const ref = Math.abs(_dirVec.z) > 0.95 ? _refX : _refZ;
      _bx.copy(ref).addScaledVector(_dirVec, -ref.dot(_dirVec)).normalize();
      _bz.crossVectors(_bx, _dirVec);
      _bm.makeBasis(_bx, _dirVec, _bz);
      conn.mesh.quaternion.setFromRotationMatrix(_bm); }
    conn.mesh.scale.set(1.0, len, 1.0);
  }
  updateRingMarker();
}

function updateRingMarker() {
  updateRingGhosts();
  const sr = window.selectedRing;
  const conn = sr && bodyConnectors.find(c => c.def.parent === sr.parent && c.def.child === sr.child);
  const ring = conn && conn.def.rings && conn.def.rings[sr.idx];
  if (!ring || !conn.mesh.visible) { ringMarker.visible = false; return; }
  const pP = conn.parent.mesh.position, cP = conn.child.mesh.position;
  ringMarker.position.lerpVectors(cP, pP, ring.t);
  _dirVec.subVectors(pP, cP).normalize();
  ringMarker.quaternion.setFromUnitVectors(_upVec, _dirVec);
  const e = ring.t * ring.t * (3 - 2 * ring.t);
  const base = conn.rCv + (conn.rPv - conn.rCv) * e;
  ringMarker.scale.setScalar(base * ring.k * 1.04);
  ringMarker.visible = true;
}

function setLayerIsolation(layer) {
  currentActiveLayer = layer;
  
  bodyConnectorsVisible = (layer === 'all' || layer === 'nude' || layer === 'skin' || layer === 'armor');

  if (layer === 'all') {
    // Normal rendering
    ponyMat.visible = true;
    organGroup.visible = true;
    rigSkeletonGroup.visible = false;
    clipPlane.constant = (typeof camMode !== 'undefined' && camMode === 'slice') ? 0.0 : 100.0;
    if (window.EWS_limbs) window.EWS_limbs.on = true;
    msg('Layer: All Visible');
  } else if (layer === 'nude') {
    // NUDE BASE VIEW: Clean body form, no mane/tail, organs hidden inside, no rig
    ponyMat.visible = true;
    organGroup.visible = false;
    rigSkeletonGroup.visible = false;
    clipPlane.constant = 100.0; // un-sliced
    if (window.EWS_limbs) window.EWS_limbs.on = true;
    msg('Layer: Nude Base View (Clean Chibi Form)');
  } else if (layer === 'rig') {
    // Layer 2: Skeletal Rig & Bones isolated in 3D
    ponyMat.visible = false;
    organGroup.visible = false;
    rigSkeletonGroup.visible = true;
    clipPlane.constant = 100.0;
    if (window.EWS_limbs) window.EWS_limbs.on = false;
    msg('Layer 2: Skeletal Rig & Bones (Isolated)');
  } else if (layer === 'viscera') {
    // Layer 1: Deep Viscera & Organs isolated
    ponyMat.visible = false;
    organGroup.visible = true;
    rigSkeletonGroup.visible = false;
    clipPlane.constant = 100.0;
    if (window.EWS_limbs) window.EWS_limbs.on = false;
    msg('Layer 1: Deep Viscera & Organs (Isolated)');
  } else if (layer === 'skin') {
    // Layer 3: Surface Skin & Coat
    ponyMat.visible = true;
    organGroup.visible = false;
    rigSkeletonGroup.visible = false;
    clipPlane.constant = 100.0;
    if (window.EWS_limbs) window.EWS_limbs.on = true;
    msg('Layer 3: Surface Skin & Coat');
  } else if (layer === 'armor') {
    // Layer 5: Armor & Outer Shell
    msg('Layer 5: Armor & Outer Shell (No armor equipped)');
  } else if (layer === 'clothing') {
    // Layer 4: Clothing & Wearables
    msg('Layer 4: Clothing & Wearables (No clothing equipped)');
  }
}

function buildHair(styleName) {
  hairMeshes.forEach(m => {
    if (m.parent) m.parent.remove(m);
    if (m.geometry) m.geometry.dispose();
  });
  hairMeshes = [];
  currentHairStyle = styleName || 'swept';

  const style = HAIR_STYLES[currentHairStyle] || HAIR_STYLES.swept;
  
  // Head and neck manes in maneTailGroup
  [style.napeMane, style.crownMane].forEach(group => {
    if (!group) return;
    group.forEach(strand => {
      const m = createSplineRibbon(strand.pts, strand.r0, strand.r1);
      maneTailGroup.add(m);
      hairMeshes.push(m);
    });
  });
  
  // Volumetric tail strands in dedicated tailGroup (anchored at sacral dock)
  if (style.tail) {
    style.tail.forEach(strand => {
      // Points relative to sacral dock (-0.35, 1.05, 0)
      const localPts = strand.pts.map(p => new THREE.Vector3(p.x - (-0.35), p.y - 1.05, p.z));
      const m = createSplineRibbon(localPts, strand.r0, strand.r1);
      m.isTail = true;
      tailGroup.add(m);
      hairMeshes.push(m);
    });
  }
}

  restingCapacity: 65.0,  // Base cavity volume (Liters)

  maxCapacity: 120.0,     // Distension limit

    const chest = bodyMeshes.find(b => b.name === 'chest');

    if (!chest || !rear) return;

    // Keep organGroup nestled inside the ribcage/pelvic cavity (local 0,0,0)
    organGroup.position.set(0, 0, 0);

    // Dynamic Volume Feedback: Organ fullness pushes outward against the bag
    const totalVol = ORGANS.getTotalVolume();
    const excess = Math.max(0, totalVol - this.restingCapacity);
    const distension = 1.0 + (excess / 100.0) * 0.40;

    // The bag tells the outer belly mesh how far to swell based on canonical SPHERES scale
    const chSph = SPHERES.find(s => s.n === 'chest');
    const reSph = SPHERES.find(s => s.n === 'rear');
    const cx = chSph ? chSph.sx : chest.baseScale.x;
    const cy = chSph ? chSph.sy : chest.baseScale.y;
    const cz = chSph ? chSph.sz : chest.baseScale.z;
    const rx = reSph ? reSph.sx : rear.baseScale.x;
    const ry = reSph ? reSph.sy : rear.baseScale.y;
    const rz = reSph ? reSph.sz : rear.baseScale.z;
    chest.mesh.scale.set(cx, cy * distension, cz * distension);
    rear.mesh.scale.set(rx, ry * distension, rz * distension);
  }
};

    computePhenotype(ext, agt, crm) {
      const hasBlack = ext.includes('E');
      const hasAgouti = agt.includes('A');
      const isDilute = crm.includes('Cr');
      const isDoubleDilute = crm === 'Cr/Cr';

      if (!hasBlack) {
        if (isDoubleDilute) return { coat: '#f4ede2', mane: '#ffffff', name: 'Cremello' };
        if (isDilute) return { coat: '#e8c97e', mane: '#f8f5eb', name: 'Palomino' };
        return { coat: '#9e3f28', mane: '#692515', name: 'Chestnut' };
      } else {
        if (hasAgouti) {
          if (isDoubleDilute) return { coat: '#eae4d5', mane: '#a89d87', name: 'Perlino' };
          if (isDilute) return { coat: '#c29d62', mane: '#241a15', name: 'Buckskin' };
          return { coat: '#804020', mane: '#1c1410', name: 'Bay' };
        } else {
          if (isDilute) return { coat: '#3a3430', mane: '#1a1614', name: 'Smoky Black' };
          return { coat: '#1e1c1b', mane: '#111010', name: 'Raven Black' };
        }
      }
    }
  },

  getTotalVolume() {
    const repro = this.reproState === 'gestating' ? (this.gestationProgress * 45.0) : 0.0;
    return this.stomachVol + (this.cecumVol * 0.4) + (this.cecalGasPressure * 0.3) + this.bladderVol + repro;
  },

  updateBellyDistension() {
    const total = this.getTotalVolume();
    const excess = Math.max(0, total - 65.0);
    const distension = 1.0 + (excess / 100.0) * 0.40;
    
    stomachMesh.scale.set(1.1 * (this.stomachVol / 12), 0.85 * (this.stomachVol / 12), 1.0);
    cecumMesh.scale.set(1.4 * (1 + this.cecalGasPressure / 100), 0.9 * (1 + this.cecalGasPressure / 100), 0.8);
    bladderMesh.scale.setScalar(0.7 + (this.bladderVol / 50) * 0.6);
    
    const chest = bodyMeshes.find(b => b.name === 'chest');
    const rear = bodyMeshes.find(b => b.name === 'rear');
    const chSph = SPHERES.find(s => s.n === 'chest');
    const reSph = SPHERES.find(s => s.n === 'rear');
    if (chest && chSph) {
      chest.mesh.scale.set(chSph.sx, chSph.sy * distension, chSph.sz * distension);
    }
    if (rear && reSph) {
      rear.mesh.scale.set(reSph.sx, reSph.sy * distension, reSph.sz * distension);
    }
  },

  swallowContraband(item = 'Lockpick') {
    this.swallowedContraband.push({ name: item, progress: 0.0 });
    bolusU = 0.0;
    this.cecalGasPressure = Math.min(100, this.cecalGasPressure + 25.0);
    this.updateBellyDistension();
    msg(`Swallowed ${item}! Traveling tract; cecal gas pressure elevated.`);
  },

  ventCecalGas() {
    if (this.cecalGasPressure < 5) { msg('Cecum pressure normal.'); return; }
    this.cecalGasPressure = 5.0;
    this.updateBellyDistension();
    msg('Vented excess cecal fermentation gas. Flank distension relieved.');
  }
};

// === 9. WALKING & PATHING SYSTEM ===
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let walkTarget = null;
let isWalking = false;
let walkSpeed = 1.6;
let walkDistance = 0;

function setWalkDestination(pt) {
  walkTarget = new THREE.Vector3(pt.x, 0, pt.z);
  targetRing.position.set(pt.x, 0.02, pt.z);
  targetRing.material.opacity = 0.85;
  isWalking = true;
}

function updateWalking(dt) {
  if (!isWalking || !walkTarget) return;

  const currentPos = characterGroup.position;
  const dx = walkTarget.x - currentPos.x;
  const dz = walkTarget.z - currentPos.z;
  const dist = Math.hypot(dx, dz);

  if (dist > 0.06) {
    const targetAngle = Math.atan2(dx, dz) - Math.PI / 2; /* model front is +x (was +z: she ran sideways) */
    { let dA = ((targetAngle - characterGroup.rotation.y + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI; characterGroup.rotation.y += dA * 0.18; } /* shortest-way turn */

    const step = Math.min(dist, walkSpeed * dt * simSpeed);
    characterGroup.position.x += (dx / dist) * step;
    characterGroup.position.z += (dz / dist) * step;
    walkDistance += step;

    const gaitFreq = 9.0;
    const swingAngle = Math.sin(walkDistance * gaitFreq) * 0.35;
    
    // Torso subtle walk bob (limb swing is handled authentically by EWS LEG GAIT v2)
    if (!window.EWS_gait) {
      bodyMeshes.forEach(b => {
        if (b.name === 'FL1' || b.name === 'BR1') b.mesh.rotation.z = swingAngle;
        else if (b.name === 'FR1' || b.name === 'BL1') b.mesh.rotation.z = -swingAngle;
      });
    }
    const chSph = SPHERES.find(s => s.n === 'chest');
    const reSph = SPHERES.find(s => s.n === 'rear');
    const chMesh = bodyMeshes.find(b => b.name === 'chest');
    const reMesh = bodyMeshes.find(b => b.name === 'rear');
    if (chMesh && chSph) chMesh.mesh.position.y = chSph.y + Math.abs(Math.sin(walkDistance * gaitFreq)) * 0.025;
    if (reMesh && reSph) reMesh.mesh.position.y = reSph.y + Math.abs(Math.sin(walkDistance * gaitFreq)) * 0.025;

    const inPool = Math.abs(currentPos.x - 17 * TILE_SIZE) < 3 * TILE_SIZE && Math.abs(currentPos.z - 17 * TILE_SIZE) < 3 * TILE_SIZE;
    if (inPool && Math.random() < 0.05) {
      msg('Splashing in water pool (wetness accumulating).');
    }
  } else {
    isWalking = false;
    targetRing.material.opacity = 0;
    bodyMeshes.forEach(b => {
      const orig = SPHERES.find(s => s.n === b.name);
      b.mesh.rotation.z = (orig && orig.rz) || 0;
      if (orig) b.mesh.position.y = orig.y;
    });
  }

  camTarget.lerp(characterGroup.position, 0.12);
  updateCameraPosition();
}

function selectMirrorPair() {
  if (!selectedNodeName) { selectBodyNode('cheekL'); return; }
  let targetName = null;
  if (selectedNodeName.includes('L')) targetName = selectedNodeName.replace('L', 'R');
  else if (selectedNodeName.includes('R')) targetName = selectedNodeName.replace('R', 'L');
  if (targetName && SPHERES.some(s => s.n === targetName)) {
    selectBodyNode(targetName);
    msg(`Switched to Mirror Partner: ${targetName}`);
  } else {
    msg(`Node ${selectedNodeName} is on the midline (no L/R partner).`);

}

function multiToggle(name) {

  if (name === selectedNodeName) {
    if (set.size) { const first = [...set][0]; set.delete(first); window._multiKeep = true; selectBodyNode(first); window._multiKeep = false; }
    return;
  }
  if (set.has(name)) set.delete(name); else set.add(name);
  msg('Selected: ' + selectedNodeName + (set.size ? ' + ' + set.size + ' more' : ''));
}

function addNewSphereNode() {
  const snap = _takeNodeSnapshot();
  const parent = window.selectedNode || SPHERES[0];
  const newName = 'node_' + (SPHERES.length + 1);
  const newSphere = {
    n: newName,
    x: +(parent.x + 0.12).toFixed(3),
    y: +(parent.y + 0.05).toFixed(3),
    z: +(parent.z).toFixed(3),
    r: 0.14,
    sx: 1.0, sy: 1.0, sz: 1.0
  };
  SPHERES.push(newSphere);

  const geo = new THREE.SphereGeometry(newSphere.r, 24, 20);
  const mesh = new THREE.Mesh(geo, ponyMat);
  mesh.position.set(newSphere.x, newSphere.y, newSphere.z);
  mesh.scale.set(newSphere.sx, newSphere.sy, newSphere.sz);
  mesh.castShadow = true;
  characterGroup.add(mesh);
  bodyMeshes.push({ name: newName, mesh, baseScale: { x: 1, y: 1, z: 1 } });

  // Add connector to parent
  CONNECTOR_DEFS.push({ parent: parent.n, child: newName, rP: parent.r * 0.6, rC: newSphere.r * 0.6 });
  if (typeof initBodyConnectors === 'function') initBodyConnectors();
  if (typeof initRigSkeleton === 'function') initRigSkeleton();

  _pushNodeUndo(snap);
  selectBodyNode(newName);
  msg(`➕ Added new sphere node: ${newName} (attached to ${parent.n})`);
}
window.addNewSphereNode = addNewSphereNode;

function deleteSelectedNode() {
  if (!selectedNodeName || ['head', 'chest', 'rear'].includes(selectedNodeName)) {
    msg('Cannot delete core anatomical spine nodes.');
    return;
  }
  const snap = _takeNodeSnapshot();
  const sIdx = SPHERES.findIndex(s => s.n === selectedNodeName);
  const bmIdx = bodyMeshes.findIndex(b => b.name === selectedNodeName);
  if (sIdx >= 0 && bmIdx >= 0) {
    const bm = bodyMeshes[bmIdx];
    if (bm && bm.mesh) {
      characterGroup.remove(bm.mesh);
      if (bm.mesh.geometry) bm.mesh.geometry.dispose();
    }
    SPHERES.splice(sIdx, 1);
    bodyMeshes.splice(bmIdx, 1);
    // Remove connectors referencing this node
    for (let i = CONNECTOR_DEFS.length - 1; i >= 0; i--) {
      if (CONNECTOR_DEFS[i].parent === selectedNodeName || CONNECTOR_DEFS[i].child === selectedNodeName) {
        CONNECTOR_DEFS.splice(i, 1);
      }
    }
    if (typeof initBodyConnectors === 'function') initBodyConnectors();
    if (typeof initRigSkeleton === 'function') initRigSkeleton();
    _pushNodeUndo(snap);
    selectBodyNode('chest');
    msg(`🗑️ Deleted node ${selectedNodeName} (Undoable)`);
  }
}
window.deleteSelectedNode = deleteSelectedNode;

function addMirrorNodePair() {
  if (!selectedNodeName) return;
  const s = SPHERES.find(x => x.n === selectedNodeName);
  if (!s) return;
  if (!s.n.includes('L') && !s.n.includes('R')) {
    msg('Select an asymmetrical node (e.g. cheekL, horn, wing) to create a mirror pair.');
    return;
  }
  const pairName = s.n.includes('L') ? s.n.replace('L', 'R') : s.n.replace('R', 'L');
  if (SPHERES.some(x => x.n === pairName)) {
    selectBodyNode(pairName);
    msg(`Mirror node ${pairName} already exists. Selected it.`);
    return;
  }
  const snap = _takeNodeSnapshot();
  const newSphere = {
    n: pairName,
    x: s.x,
    y: s.y,
    z: -s.z,
    r: s.r,
    sx: s.sx, sy: s.sy, sz: s.sz
  };
  SPHERES.push(newSphere);
  const geo = new THREE.SphereGeometry(newSphere.r, 24, 20);
  const mesh = new THREE.Mesh(geo, ponyMat);
  mesh.position.set(newSphere.x, newSphere.y, newSphere.z);
  mesh.scale.set(newSphere.sx, newSphere.sy, newSphere.sz);
  mesh.castShadow = true;
  characterGroup.add(mesh);
  bodyMeshes.push({ name: pairName, mesh, baseScale: { x: s.sx, y: s.sy, z: s.sz } });

  // Connect to matching parent
  const existingConn = CONNECTOR_DEFS.find(c => c.child === s.n);
  if (existingConn) {
    const parentPair = existingConn.parent.includes('L') ? existingConn.parent.replace('L', 'R') : existingConn.parent;
    CONNECTOR_DEFS.push({ parent: parentPair, child: pairName, rP: existingConn.rP, rC: existingConn.rC,
      rings: existingConn.rings ? existingConn.rings.map(r => ({ t: r.t, k: r.k })) : undefined });
  }
  if (typeof initBodyConnectors === 'function') initBodyConnectors();
  if (typeof initRigSkeleton === 'function') initRigSkeleton();
  _pushNodeUndo(snap);
  selectBodyNode(pairName);
  msg(`🪞 Created symmetrical mirror node: ${pairName}`);
}
window.addMirrorNodePair = addMirrorNodePair;

// Rigorous Chord & Circumference Calculation
// Ensures chord distance between any two adjacent button centers is >= diameter + minGap
function calcRingRadius(itemCount, btnDiameter, minGap, minRadius) {
  if (itemCount <= 0) return minRadius;
  const chordNeeded = btnDiameter + minGap;
  const sinHalfAngle = Math.sin(Math.PI / Math.max(itemCount, 3));
  const rCircum = Math.round(chordNeeded / (2 * sinHalfAngle));
  return Math.max(minRadius, rCircum);
}

function setRevolverState(stateName, categoryFolder = null) {
  if (!REVOLVER_MODES[stateName]) stateName = 'LIVE';
  currentRevolverState = stateName;
  expandedRevolverCategory = categoryFolder;
  if (typeof updateToolFlyout === 'function') updateToolFlyout(stateName);
  const container = $('rev-bullets');
  if (!container) return;
  container.innerHTML = '';

  const modeDef = REVOLVER_MODES[stateName] || {};
  const customState = userCustomRevolver[stateName] || { folders: [], bullets: [] };

  // Parse inner, outer, and layer-3 expanded tool lists
  let innerItems = [];
  let outerItems = [];
  let layer3Items = [];

  if (Array.isArray(modeDef)) {
    innerItems = modeDef.concat(customState.bullets || []);
  } else {
    innerItems = (modeDef.inner || []).concat(customState.bullets || []);
    outerItems = (modeDef.outer || []).slice();
  }
  innerItems = innerItems.concat(customState.folders || []);

  // If a category folder is selected / expanded:
  // If outerItems already exist, folder expands into Layer 3 (no replacing or collision).
  // If outerItems is empty, folder populates Layer 2.
  if (expandedRevolverCategory) {
    const allSearch = innerItems.concat(outerItems);
    const catObj = allSearch.find(it => (it.id === expandedRevolverCategory || it.lbl === expandedRevolverCategory) && (it.items || it.isFolder));
    if (catObj && catObj.items) {
      if (outerItems.length > 0) {
        layer3Items = catObj.items.slice();
      } else {
        outerItems = catObj.items.slice();
      }
    }
  }

  // --- RING LAYOUT: each ring is a wheel of 8 chambers; all rings share the same spoke angles ---
  const RING_SLOTS = 8;
  const rings = [];
  const pushGroup = (group, items, addInfo) => {
    const list = items.map(cfg => ({ cfg })).concat([{ add: addInfo }]);
    for (let i = 0; i < list.length; i += RING_SLOTS) rings.push({ group, slots: list.slice(i, i + RING_SLOTS) });
  };
  const folderAddTarget = (layer3Items.length === 0 && expandedRevolverCategory) ? expandedRevolverCategory : null;
  pushGroup('inner', innerItems, { title: 'Add Button or Folder to Inner Ring', folder: null });
  if (outerItems.length > 0) {
    pushGroup('outer', outerItems, { title: folderAddTarget ? `Add Tool to [${folderAddTarget}]` : 'Add Tool to Row 2', folder: folderAddTarget });
  }
  if (layer3Items.length > 0) {
    pushGroup('folder', layer3Items, { title: `Add Tool to Folder [${expandedRevolverCategory}]`, folder: expandedRevolverCategory });
  }
  const ringSize = (ring, idx) => ring.group === 'folder' ? 30 : (idx === 0 ? 36 : 32);
  const ringR = [];
  rings.forEach((ring, idx) => {
    ringR[idx] = idx === 0
      ? calcRingRadius(RING_SLOTS, ringSize(ring, 0), 2, 46)
      : ringR[idx - 1] + ringSize(rings[idx - 1], idx - 1) / 2 + ringSize(ring, idx) / 2 + 2;
  });
  window._revRingR = ringR;
  window._revRingCount = rings.length;
  const loadedRings = (typeof window.EWS_revLoad === 'number') ? Math.min(window.EWS_revLoad, rings.length) : rings.length;

  rings.forEach((ring, ri) => {
    for (let si = 0; si < RING_SLOTS; si++) {
      const angle = (si / RING_SLOTS) * Math.PI * 2 - Math.PI / 2;
      const x = Math.round(Math.cos(angle) * ringR[ri]);
      const y = Math.round(Math.sin(angle) * ringR[ri]);
      const slot = ring.slots[si];
      let el;
      if (!slot) {
        el = document.createElement('div');
        el.className = 'chamber';
      } else if (slot.add) {
        el = document.createElement('div');
        el.className = 'bullet btn-add' + (ring.group === 'folder' ? ' layer-3' : (ri > 0 ? ' layer-2 outer-ring' : ''));
        el.innerHTML = `<span class="bullet-ico">➕</span><span class="bullet-lbl">ADD</span>`;
        el.title = slot.add.title;
        el.onclick = (e) => { e.stopPropagation(); openAddRevolverModal(stateName, slot.add.folder); };
      } else {
        const cfg = slot.cfg;
        el = document.createElement('div');
        el.className = 'bullet' + (ring.group === 'folder' ? ' layer-3' : (ri > 0 ? ' layer-2 outer-ring' : ''));
        if (cfg.isFolder) {
          el.classList.add('folder-bullet');
          if (expandedRevolverCategory === (cfg.id || cfg.lbl)) el.classList.add('folder-open');
        }
        el.innerHTML = `<span class="bullet-ico">${cfg.icon}</span><span class="bullet-lbl">${cfg.lbl || (cfg.title ? cfg.title.split(' ')[0] : 'TOOL')}</span>`;
        el.title = ring.group === 'folder' ? `[${expandedRevolverCategory}] ${cfg.title || cfg.lbl}` : (cfg.title || cfg.lbl);
        el.onclick = (e) => {
          e.stopPropagation();
          if (ring.group !== 'folder' && (cfg.isFolder || cfg.items)) {
            const fId = cfg.id || cfg.lbl;
            setRevolverState(stateName, expandedRevolverCategory === fId ? null : fId);
          } else if (cfg.run) {
            try { cfg.run(); } catch (err) { msg('⚠ ' + cfg.title + ': ' + err.message); }
          }
        };
      }
      el.dataset.ring = ri; el.dataset.slot = si; el.dataset.x = x; el.dataset.y = y;
      container.appendChild(el);
      _placeRevBullet(el, ri < loadedRings, 0);
    }
  });
  placeRevSatellites();

  refreshRevolverReadout();
}
window.EWS_setRevolverState = setRevolverState;

// --- Revolver wheel helpers: stow / load rings, satellites, primer spin, dock ---
function _placeRevBullet(el, loaded, delayMs) {
  const x = el.dataset.x, y = el.dataset.y;
  el.style.transitionDelay = (delayMs || 0) + 'ms';
  if (loaded) {
    el.style.transform = `rotate(0deg) translate(${x}px, ${y}px) scale(1)`;
    el.style.opacity = '';
    el.style.pointerEvents = '';
  } else {
    el.style.transform = 'rotate(-160deg) translate(0px, 0px) scale(0.25)';
    el.style.opacity = '0';
    el.style.pointerEvents = 'none';
  }
}
function _revVisibleRings() {
  const total = window._revRingCount || 0;
  return (typeof window.EWS_revLoad === 'number') ? Math.min(window.EWS_revLoad, total) : total;
}
function placeRevSatellites() {
  const gear = $('rev-settings-orb'), primer = $('rev-primer');
  if (!gear || !primer) return;
  const L = _revVisibleRings();
  const R = window._revRingR || [];
  const D = (L > 0 && R[L - 1] != null) ? R[L - 1] + 26 : 46;
  const base = -Math.PI * 0.375;                       // between two spokes, upper right
  const gap = 2 * Math.asin(Math.min(1, 27 / (2 * D)));
  const put = (el, ang) => { el.style.transform = `translate(${Math.round(Math.cos(ang) * D)}px, ${Math.round(Math.sin(ang) * D)}px)`; };
  put(gear, base - gap / 2);
  put(primer, base + gap / 2);
}
function applyRevolverLoad(animate) {
  const L = _revVisibleRings();
  document.querySelectorAll('#rev-bullets [data-ring]').forEach(el => {
    _placeRevBullet(el, (+el.dataset.ring) < L, animate ? (+el.dataset.slot) * 24 : 0);
  });
  placeRevSatellites();
}
window.applyRevolverLoad = applyRevolverLoad;
function stepRevolverLoad(dir) {
  const total = window._revRingCount || 0;
  const cur = _revVisibleRings();
  const next = Math.max(0, Math.min(total, cur + dir));
  if (next === cur) { msg(dir > 0 ? 'Revolver fully loaded' : 'Revolver tucked away'); return; }
  window.EWS_revLoad = (next >= total) ? null : next;
  try { localStorage.setItem('EWS_REV_LOAD', window.EWS_revLoad === null ? 'all' : String(window.EWS_revLoad)); } catch (_) {}
  applyRevolverLoad(true);
  msg(next === 0 ? 'Revolver tucked away' : `Rings loaded: ${next} / ${total}`);
}
window.stepRevolverLoad = stepRevolverLoad;
function dockRevolver() {
  window._revPrevLoad = (typeof window.EWS_revLoad === 'number') ? window.EWS_revLoad : null;
  window.EWS_revLoad = 0;
  applyRevolverLoad(true);
  setTimeout(() => {
    document.body.classList.add('rev-docked');
    document.body.classList.remove('rev-dockhint');
    if (window._revPrevCenter) setRevCenter(window._revPrevCenter.x, window._revPrevCenter.y);
  }, 420);
  try { localStorage.setItem('EWS_REV_DOCK', '1'); } catch (_) {}
  msg('Revolver docked. Tap TOOLS on the left to bring it back.');
}
function undockRevolver() {
  window.EWS_revLoad = 0;
  document.body.classList.remove('rev-docked');
  applyRevolverLoad(false);
  setTimeout(() => {
    window.EWS_revLoad = (typeof window._revPrevLoad === 'number' && window._revPrevLoad > 0) ? window._revPrevLoad : null;
    applyRevolverLoad(true);
  }, 40);
  try { localStorage.removeItem('EWS_REV_DOCK'); } catch (_) {}
  msg('Revolver is back.');
}
window.dockRevolver = dockRevolver;
window.undockRevolver = undockRevolver;

function filterCatalogSearch(query, stateName, targetFolder) {
  const box = $('catalog-results');

// Revolver Dragging & Hub Center Positioning
const rev = $('revolver');
const revHub = $('rev-hub');
let revCenter = {
  x: Math.max(80, Math.min(window.innerWidth - 80, window.innerWidth - 110)),
  y: Math.max(80, Math.min(window.innerHeight - 80, window.innerHeight - 130))
};
let isDraggingRev = false;
let revDragOffset = [0, 0];
let revMoved = false;
let revDownTime = 0;
let revDownAt = [0, 0];
let revPointer = null;

function setRevCenter(cx, cy) {
  const margin = 70;
  const w = window.innerWidth || 400;
  const h = window.innerHeight || 700;
  const clampedX = Math.max(margin, Math.min(w - margin, cx));
  const clampedY = Math.max(margin, Math.min(h - margin, cy));
  revCenter.x = clampedX;
  revCenter.y = clampedY;
  
  // Container is 380x380, center point is at (190, 190)
  rev.style.left = (clampedX - 190) + 'px';
  rev.style.top = (clampedY - 190) + 'px';
  
  try {
    localStorage.setItem('EWS_REV_POS', JSON.stringify({ cx: clampedX, cy: clampedY }));
  } catch(_) {}
}
window.setRevCenter = setRevCenter;
window.setRevPos = (x, y) => setRevCenter(x + 190, y + 190);

// Load stored position or default to safe bottom-right
try {
  const savedPos = localStorage.getItem('EWS_REV_POS');
  if (savedPos) {
    const p = JSON.parse(savedPos);
    if (typeof p.cx === 'number' && typeof p.cy === 'number') {
      revCenter.x = p.cx;
      revCenter.y = p.cy;
    }
  }
} catch(_) {}
setRevCenter(revCenter.x, revCenter.y);
window.addEventListener('resize', () => setRevCenter(revCenter.x, revCenter.y));

revHub.addEventListener('pointerdown', e => {
  // If tapped speed tag, let its click event handle speed cycle
  if (e.target.closest('#rev-speed-tag')) return;
  isDraggingRev = true;
  revMoved = false;
  revPointer = e.pointerId;
  revDownTime = performance.now();
  revDragOffset = [e.clientX - revCenter.x, e.clientY - revCenter.y];
  revDownAt = [e.clientX, e.clientY];
  window._revPrevCenter = { x: revCenter.x, y: revCenter.y };
  try { revHub.setPointerCapture(e.pointerId); } catch (_) {}
  e.preventDefault();
  e.stopPropagation();
});

window.addEventListener('pointermove', e => {
  if (!isDraggingRev || e.pointerId !== revPointer) return;
  if (Math.hypot(e.clientX - revDownAt[0], e.clientY - revDownAt[1]) > 5) {
    revMoved = true;
  }
  if (revMoved) {
    setRevCenter(e.clientX - revDragOffset[0], e.clientY - revDragOffset[1]);
    window._revInDock = e.clientX < 84 && e.clientY < 400;
    document.body.classList.toggle('rev-dockhint', e.clientX < 160 && e.clientY < 440);
    const dk = $('rev-dock'); if (dk) dk.classList.toggle('on', !!window._revInDock);
  }
  e.preventDefault();
  e.stopPropagation();
}, true);

const revEnd = e => {
  if (e.pointerId !== revPointer) return;
  const elapsed = performance.now() - revDownTime;
  // Short tap on the central hub toggles Pause / Play
  if (!revMoved && elapsed < 280) {
    window.EWS_paused = !window.EWS_paused;
    refreshPauseUI();
    msg(window.EWS_paused ? '⏸ Simulation Paused' : '▶ Simulation Resumed');
  }
  if (revMoved && window._revInDock) dockRevolver();
  window._revInDock = false;
  document.body.classList.remove('rev-dockhint');
  const dk2 = $('rev-dock'); if (dk2) dk2.classList.remove('on');
  isDraggingRev = false;
  revPointer = null;
  try { revHub.releasePointerCapture(e.pointerId); } catch (_) {}
};
window.addEventListener('pointerup', revEnd, true);
window.addEventListener('pointercancel', revEnd, true);

// Primer: spin right = load a ring, spin left = tuck one away (a straight swipe or a tap also works)
(function () {
  const pr = $('rev-primer');
  if (!pr) return;
  let g = null;
  pr.addEventListener('pointerdown', e => {
    const r = pr.getBoundingClientRect();
    g = { id: e.pointerId, cx: r.left + r.width / 2, cy: r.top + r.height / 2, x0: e.clientX, y0: e.clientY,
          lastA: null, acc: 0, swipeX: e.clientX, moved: false, mode: null };
    try { pr.setPointerCapture(e.pointerId); } catch (_) {}
    e.preventDefault(); e.stopPropagation();
  });
  pr.addEventListener('pointermove', e => {
    if (!g || e.pointerId !== g.id) return;
    const dist = Math.hypot(e.clientX - g.x0, e.clientY - g.y0);
    if (dist > 6) g.moved = true;
    const dFromC = Math.hypot(e.clientX - g.cx, e.clientY - g.cy);
    if (g.mode !== 'swipe' && dFromC > 10) {
      const a = Math.atan2(e.clientY - g.cy, e.clientX - g.cx);
      if (g.lastA !== null) {
        let d = a - g.lastA;
        if (d > Math.PI) d -= 2 * Math.PI;
        if (d < -Math.PI) d += 2 * Math.PI;
        g.acc += d;
        const STEP = Math.PI / 6;
        while (g.acc >= STEP) { g.acc -= STEP; g.mode = 'rot'; stepRevolverLoad(+1); }
        while (g.acc <= -STEP) { g.acc += STEP; g.mode = 'rot'; stepRevolverLoad(-1); }
      }
      g.lastA = a;
    }
    if (g.mode !== 'rot') {
      const dx = e.clientX - g.swipeX;
      if (dx >= 36) { g.mode = 'swipe'; g.swipeX = e.clientX; stepRevolverLoad(+1); }
      else if (dx <= -36) { g.mode = 'swipe'; g.swipeX = e.clientX; stepRevolverLoad(-1); }
    }
    e.preventDefault(); e.stopPropagation();
  });
  const end = e => {
    if (!g || e.pointerId !== g.id) return;
    if (!g.moved) {   // plain tap: tuck everything away, or load everything back
      const total = window._revRingCount || 0;
      if (_revVisibleRings() > 0) { window.EWS_revLoad = 0; msg('Revolver tucked away'); }
      else { window.EWS_revLoad = null; msg('Revolver fully loaded'); }
      try { localStorage.setItem('EWS_REV_LOAD', window.EWS_revLoad === null ? 'all' : '0'); } catch (_) {}
      applyRevolverLoad(true);
    }
    try { pr.releasePointerCapture(e.pointerId); } catch (_) {}
    g = null;
  };
  pr.addEventListener('pointerup', end);
  pr.addEventListener('pointercancel', end);
})();

// === LIVE PROCEDURAL SCRUBBER & ACTIVE RAGDOLL ATTRACTOR SPRINGS ===
// Computes morphologically adaptive posture: hind leg spread, pelvis tuck, tail lift, fluid emission
function applyDynamicEliminationPose(phase, intensity = 0.65) {
  ACTION_DIRECTOR.scrubPhase = phase;
  const S = Math.sin(phase * Math.PI) * intensity; // stance curve (0 at start/end, peak at 0.5)

  // 1. Pelvis and Rear Drop / Tuck
  bodyMeshes.forEach(b => {
    const orig = SPHERES.find(s => s.n === b.name);
    if (!orig) return;

    if (b.name === 'pelvis' || b.name === 'rear') {
      b.mesh.position.y = orig.y - S * 0.07;
      b.mesh.rotation.z = -S * 0.15; // slight sacral pelvic flexion
    } else if (b.name === 'chest') {
      b.mesh.position.y = orig.y - S * 0.02; // slight forward counterbalance
    }
    // 2. Hind Legs Step Back & Spread Outward (Elimination Triangle)
    else if (b.name === 'BL4' || b.name === 'BL3') {
      b.mesh.position.x = orig.x - S * 0.08; // step backward
      b.mesh.position.z = orig.z + S * 0.07; // spread left
    } else if (b.name === 'BR4' || b.name === 'BR3') {
      b.mesh.position.x = orig.x - S * 0.08; // step backward
      b.mesh.position.z = orig.z - S * 0.07; // spread right
    } else if (b.name === 'BL2' || b.name === 'BR2') {
      b.mesh.position.x = orig.x - S * 0.05; // hocks flex backward
    } else if (b.name.startsWith('FL') || b.name.startsWith('FR')) {
      // Forelegs remain planted for stability
      b.mesh.position.x = orig.x;
      b.mesh.position.z = orig.z;
    }
  });

  // 3. Tail High-Elevation Lift (Pivots upward away from perineal stream)
  if (typeof tailGroup !== 'undefined') {
    const liftAngle = S * 0.95; // up to ~55 degrees dorsal arch
    tailGroup.rotation.z = -liftAngle;
    tailGroup.position.y = 1.05 + S * 0.04;
  }

  // 4. Fluid Stream Parabola & Splat Deposition
  const shouldStream = (phase >= 0.38 && phase <= 0.88) || ACTION_DIRECTOR.isManualStreaming;
  if (shouldStream && fluidStreamLine) {
    fluidStreamLine.visible = true;
    
    // Perineal / Urethral outlet origin (in characterGroup local space)
    const pOrigin = new THREE.Vector3(-0.36, 0.72 - S * 0.07, 0);
    // Ground impact point behind pony
    const pImpact = new THREE.Vector3(-0.54, 0.02, 0);
    
    const pts = [];
    for (let i = 0; i <= 12; i++) {
      const u = i / 12;
      const x = pOrigin.x * (1 - u) + pImpact.x * u;
      const y = Math.max(0.01, (pOrigin.y * (1 - u) + pImpact.y * u) - Math.sin(u * Math.PI) * 0.12);
      const z = pOrigin.z * (1 - u) + pImpact.z * u;
      pts.push(new THREE.Vector3(x, y, z));
    }
    fluidStreamLine.geometry.setFromPoints(pts);

    // Splat deposition on terrain roughness map
    const worldImpact = characterGroup.localToWorld(pImpact.clone());
    if (typeof addSplat === 'function') {
      addSplat(worldImpact.x, worldImpact.z, 0.35 + intensity * 0.15, 'urine', 'scent_mark');
    }
    
    // Drain Bladder Volume
    if (ORGANS && ORGANS.bladderVol > 0.5) {
      ORGANS.bladderVol = Math.max(0, ORGANS.bladderVol - 0.20);
      ORGANS.updateBellyDistension();
    }
  } else if (fluidStreamLine) {
    fluidStreamLine.visible = false;
  }

  // Update Scrubber UI readouts if present
  const phaseLbl = document.getElementById('scrub-phase-lbl');
  if (phaseLbl) phaseLbl.textContent = `${Math.round(phase * 100)}%`;
}
window.applyDynamicEliminationPose = applyDynamicEliminationPose;

function setManualStream(active) {
  ACTION_DIRECTOR.isManualStreaming = active;

    applyDynamicEliminationPose(Math.max(0.5, ACTION_DIRECTOR.scrubPhase), ACTION_DIRECTOR.intensity);
    msg('Streaming urine... Scent marking terrain.');

}

  const el = document.getElementById('dir-status');
  if (el) {
    const act = ACTION_DIRECTOR.action.toUpperCase();
    const tgt = ACTION_DIRECTOR.action === 'pee' ? `${ACTION_DIRECTOR.targetMode.toUpperCase()} (${ACTION_DIRECTOR.targetPos.x.toFixed(1)}, ${ACTION_DIRECTOR.targetPos.z.toFixed(1)})` : ACTION_DIRECTOR.target;
    el.textContent = `Director: ${ACTION_DIRECTOR.initiator} -> ${tgt} | ${act} (${Math.round(ACTION_DIRECTOR.intensity * 100)}% Intensity, Scrub: ${Math.round(ACTION_DIRECTOR.scrubPhase * 100)}%)`;
  }
}

let directedEliminationTimer = null;

function executeDirectedAction() {
  const { action, intensity, targetPos, autoRelease } = ACTION_DIRECTOR;
  
  if (action === 'pee') {
    msg(`Directing pony to Scent Target (${targetPos.x.toFixed(1)}, ${targetPos.z.toFixed(1)})...`);
    
    // Calculate approach point offset so hindquarters back up to target
    const currentPos = characterGroup.position;
    const dx = currentPos.x - targetPos.x;
    const dz = currentPos.z - targetPos.z;
    const dist = Math.hypot(dx, dz);
    
    // Approach destination ~0.75m from mark target
    const destX = targetPos.x + (dist > 0.01 ? (dx / dist) * 0.75 : 0.75);
    const destZ = targetPos.z + (dist > 0.01 ? (dz / dist) * 0.75 : 0);
    setWalkDestination({ x: destX, z: destZ });
    
    // Connect dynamic active ragdoll tension
    if (window.EWS_dyn) {
      window.EWS_dyn.setTension(intensity * 0.5);
    }

    clearInterval(directedEliminationTimer);
    // Monitor arrival & ramp up attention
    directedEliminationTimer = setInterval(() => {
      const curDist = Math.hypot(targetPos.x - characterGroup.position.x, targetPos.z - characterGroup.position.z);
      
      // Dynamic Attention Ramp with Proximity
      const attention = Math.max(0, Math.min(1, (1.0 - (curDist - 0.75) / 3.0))) * intensity;
      if (curDist > 0.85) {
        // Pre-urge cues: slight tail elevation as urge builds
        if (typeof tailGroup !== 'undefined') tailGroup.rotation.z = -attention * 0.3;
      } else {
        // Arrived at target!
        clearInterval(directedEliminationTimer);
        isWalking = false;
        targetRing.material.opacity = 0;
        
        // Orient hindquarters toward target
        const faceAngle = Math.atan2(targetPos.x - characterGroup.position.x, targetPos.z - characterGroup.position.z) - Math.PI / 2;
        characterGroup.rotation.y = faceAngle + Math.PI; // back up to target
        
        msg('Arrived at scent target. Adopting elimination stance.');
        
        if (autoRelease) {
          // Play procedural elimination sequence over 4.5 seconds
          let startT = performance.now();
          const dur = 4500;
          const seqTimer = setInterval(() => {
            const p = (performance.now() - startT) / dur;
            if (p >= 1.0) {
              clearInterval(seqTimer);
              applyDynamicEliminationPose(0, intensity);
              msg('Elimination sequence completed. Posture restored.');
            } else {
              applyDynamicEliminationPose(p, intensity);
            }
          }, 40);
        } else {
          // Adopt stance and wait for manual hold-to-stream
          applyDynamicEliminationPose(0.5, intensity);
          msg('In stance. Hold [💧 Hold to Stream] button to release.');
        }
      }
    }, 100);
    
    updateDirectorStatus();
    return;
  }
  
  msg(`Action Executed: ${ACTION_DIRECTOR.initiator} -> ${ACTION_DIRECTOR.target} (${action}, ${Math.round(intensity * 100)}%)`);
  if (window.EWS_dyn) window.EWS_dyn.setTension(intensity * 0.5);
  updateDirectorStatus();
}

(function initTranslateGizmo() {
  const len = 0.35, shaftR = 0.020, headR = 0.050, headLen = 0.11;
  
  // +X Axis (Forward - Red)
  const shaftX = new THREE.Mesh(new THREE.CylinderGeometry(shaftR, shaftR, len), gizmoMatX);
  shaftX.rotation.z = -Math.PI / 2; shaftX.position.x = len / 2;
  const coneX = new THREE.Mesh(new THREE.ConeGeometry(headR, headLen, 14), gizmoMatX);
  coneX.rotation.z = -Math.PI / 2; coneX.position.x = len + headLen / 2;
  shaftX.userData = { type: 'translate', axis: 'x' }; coneX.userData = { type: 'translate', axis: 'x' };
  translateGizmoGroup.add(shaftX, coneX); gizmoHandles.push(shaftX, coneX);

  // +Y Axis (Up - Green)
  const shaftY = new THREE.Mesh(new THREE.CylinderGeometry(shaftR, shaftR, len), gizmoMatY);
  shaftY.position.y = len / 2;
  const coneY = new THREE.Mesh(new THREE.ConeGeometry(headR, headLen, 14), gizmoMatY);
  coneY.position.y = len + headLen / 2;
  shaftY.userData = { type: 'translate', axis: 'y' }; coneY.userData = { type: 'translate', axis: 'y' };
  translateGizmoGroup.add(shaftY, coneY); gizmoHandles.push(shaftY, coneY);

  // +Z Axis (Lateral - Blue)
  const shaftZ = new THREE.Mesh(new THREE.CylinderGeometry(shaftR, shaftR, len), gizmoMatZ);
  shaftZ.rotation.x = Math.PI / 2; shaftZ.position.z = len / 2;
  const coneZ = new THREE.Mesh(new THREE.ConeGeometry(headR, headLen, 14), gizmoMatZ);
  coneZ.rotation.x = Math.PI / 2; coneZ.position.z = len + headLen / 2;
  shaftZ.userData = { type: 'translate', axis: 'z' }; coneZ.userData = { type: 'translate', axis: 'z' };
  translateGizmoGroup.add(shaftZ, coneZ); gizmoHandles.push(shaftZ, coneZ);

  // Center Free Move
  const centerSph = new THREE.Mesh(new THREE.SphereGeometry(0.034, 14, 14), gizmoMatCenter);
  centerSph.userData = { type: 'translate', axis: 'view' };
  translateGizmoGroup.add(centerSph); gizmoHandles.push(centerSph);
})();
