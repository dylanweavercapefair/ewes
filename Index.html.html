const selHalo = selOutlineMesh;

let activeGizmoDrag = null;
let gizmoDragPlane = new THREE.Plane();
let gizmoDragPlaneIntersect = new THREE.Vector3();
let gizmoDragStartPoint = new THREE.Vector3();
let gizmoStartSnapshot = null;

window.addEventListener('pointerdown', e => {
  if (e.target.closest('#revolver, #sheet, .orb, #st3dframe, .modal')) return;
  touchStartPos = [e.clientX, e.clientY];
  touchMoved = false;

  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  // Check if pointer hit an active 3D gizmo handle
  if (gizmoGroup.visible) {
    const activeGroup = activeGizmoMode === 'translate' ? translateGizmoGroup : (activeGizmoMode === 'rotate' ? rotateGizmoGroup : scaleGizmoGroup);
    const hits = raycaster.intersectObjects(activeGroup.children, true);
    if (hits.length > 0) {
      const hit = hits[0];
      const handle = hit.object;
      const type = handle.userData.type;
      const axis = handle.userData.axis;
      const s = window.selectedNode || SPHERES.find(x => x.n === selectedNodeName);
      if (s) {
        activeGizmoDrag = {
          type,
          axis,
          handle,
          nodeName: s.n,
          startPos: { x: s.x, y: s.y, z: s.z },
          startScale: { sx: s.sx, sy: s.sy, sz: s.sz, r: s.r },
          startGizmoPos: gizmoGroup.position.clone(),
          startRot: (bodyMeshes.find(b => b.name === s.n) || { mesh: { rotation: new THREE.Euler() } }).mesh.rotation.clone()
        };
        gizmoStartSnapshot = _takeNodeSnapshot();
        activeGizmoDrag.others = [...(window.multiSet || [])].filter(n => n !== s.n).map(n => { const o = SPHERES.find(x => x.n === n); return o ? { o, x: o.x, y: o.y, z: o.z } : null; }).filter(Boolean);

        // Construct drag plane passing through gizmoGroup.position
        const camDir = new THREE.Vector3();
        camera.getWorldDirection(camDir);

        if (type === 'translate' || type === 'scale') {
          const ax = (axis === 'x' || axis === 'sx') ? new THREE.Vector3(1, 0, 0)
                   : (axis === 'y' || axis === 'sy') ? new THREE.Vector3(0, 1, 0)
                   : (axis === 'z' || axis === 'sz') ? new THREE.Vector3(0, 0, 1) : null;
          if (ax) {
            // plane that contains the arrow AND faces the camera as much as possible
            const normal = camDir.clone().addScaledVector(ax, -camDir.dot(ax));
            if (normal.lengthSq() < 0.02) normal.copy(ax.y ? new THREE.Vector3(0, 0, 1) : new THREE.Vector3(0, 1, 0));
            normal.normalize();
            gizmoDragPlane.setFromNormalAndCoplanarPoint(normal, gizmoGroup.position);
          } else {
            gizmoDragPlane.setFromNormalAndCoplanarPoint(camDir.clone().negate(), gizmoGroup.position);
          }
        } else if (type === 'rotate') {
          if (axis === 'x') gizmoDragPlane.setFromNormalAndCoplanarPoint(new THREE.Vector3(1, 0, 0), gizmoGroup.position);
          else if (axis === 'y') gizmoDragPlane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0, 1, 0), gizmoGroup.position);
          else if (axis === 'z') gizmoDragPlane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0, 0, 1), gizmoGroup.position);
        }

        if (raycaster.ray.intersectPlane(gizmoDragPlane, gizmoDragStartPoint)) {
          e.stopPropagation();
          return;
        }
      }
    }
  }
});

window.addEventListener('pointermove', e => {
  if (e.target.closest('#revolver, #sheet, .orb, #st3dframe, .modal')) return;

  if (activeGizmoDrag) {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);

    if (raycaster.ray.intersectPlane(gizmoDragPlane, gizmoDragPlaneIntersect)) {
      const delta = gizmoDragPlaneIntersect.clone().sub(gizmoDragStartPoint);
      const s = SPHERES.find(x => x.n === activeGizmoDrag.nodeName);
      if (!s) return;

      if (activeGizmoDrag.type === 'translate') {
        if (activeGizmoDrag.axis === 'x') {
          s.x = +(activeGizmoDrag.startPos.x + delta.x).toFixed(3);
        } else if (activeGizmoDrag.axis === 'y') {
          s.y = Math.max(0.02, +(activeGizmoDrag.startPos.y + delta.y).toFixed(3));
        } else if (activeGizmoDrag.axis === 'z') {
          s.z = +(activeGizmoDrag.startPos.z + delta.z).toFixed(3);
        } else if (activeGizmoDrag.axis === 'view') {
          s.x = +(activeGizmoDrag.startPos.x + delta.x).toFixed(3);
          s.y = Math.max(0.02, +(activeGizmoDrag.startPos.y + delta.y).toFixed(3));
          s.z = +(activeGizmoDrag.startPos.z + delta.z).toFixed(3);
        }

        const bm = bodyMeshes.find(b => b.name === s.n);
        if (bm) bm.mesh.position.set(s.x, s.y, s.z);

        // GROUP MOVE: every other selected sphere gets the same move (and its mirror partner follows)
        if (activeGizmoDrag.others && activeGizmoDrag.others.length) {
          const dX = s.x - activeGizmoDrag.startPos.x, dY = s.y - activeGizmoDrag.startPos.y, dZ = s.z - activeGizmoDrag.startPos.z;
          activeGizmoDrag.others.forEach(t => {
            t.o.x = +(t.x + dX).toFixed(3); t.o.y = Math.max(0.02, +(t.y + dY).toFixed(3)); t.o.z = +(t.z + dZ).toFixed(3);
            const tb = bodyMeshes.find(b => b.name === t.o.n); if (tb) tb.mesh.position.set(t.o.x, t.o.y, t.o.z);
            if (window.EWS_mirrorOn !== false && (t.o.n.includes('L') || t.o.n.includes('R'))) {
              const pn = t.o.n.includes('L') ? t.o.n.replace('L', 'R') : t.o.n.replace('R', 'L');
              if (!window.multiSet.has(pn) && pn !== s.n) {
                const ps = SPHERES.find(x => x.n === pn), pb = bodyMeshes.find(b => b.name === pn);
                if (ps && pb) { ps.x = t.o.x; ps.y = t.o.y; ps.z = -t.o.z; pb.mesh.position.set(ps.x, ps.y, ps.z); }
              }
            }
          });
        }

        if (window.EWS_mirrorOn !== false && (s.n.includes('L') || s.n.includes('R'))) {
          const pairName = s.n.includes('L') ? s.n.replace('L', 'R') : s.n.replace('R', 'L');
          const pairS = SPHERES.find(x => x.n === pairName);
          const pairBm = bodyMeshes.find(b => b.name === pairName);
          if (pairS && pairBm) {
            pairS.x = s.x; pairS.y = s.y; pairS.z = -s.z;
            pairBm.mesh.position.set(pairS.x, pairS.y, pairS.z);
          }
        }
      } else if (activeGizmoDrag.type === 'scale') {
        if (activeGizmoDrag.axis === 'sx') {
          s.sx = Math.max(0.2, +(activeGizmoDrag.startScale.sx + delta.x * 2.5).toFixed(3));
        } else if (activeGizmoDrag.axis === 'sy') {
          s.sy = Math.max(0.2, +(activeGizmoDrag.startScale.sy + delta.y * 2.5).toFixed(3));
        } else if (activeGizmoDrag.axis === 'sz') {
          s.sz = Math.max(0.2, +(activeGizmoDrag.startScale.sz + delta.z * 2.5).toFixed(3));
        } else if (activeGizmoDrag.axis === 'all') {
          const u = delta.x + delta.y;
          s.sx = Math.max(0.2, +(activeGizmoDrag.startScale.sx + u * 2.0).toFixed(3));
          s.sy = Math.max(0.2, +(activeGizmoDrag.startScale.sy + u * 2.0).toFixed(3));
          s.sz = Math.max(0.2, +(activeGizmoDrag.startScale.sz + u * 2.0).toFixed(3));
        }
        const bm = bodyMeshes.find(b => b.name === s.n);
        if (bm) {
          bm.baseScale = { x: s.sx, y: s.sy, z: s.sz };
          bm.mesh.scale.set(s.sx, s.sy, s.sz);
        }
        if (window.EWS_mirrorOn !== false && (s.n.includes('L') || s.n.includes('R'))) {
          const pairName = s.n.includes('L') ? s.n.replace('L', 'R') : s.n.replace('R', 'L');
          const pairS = SPHERES.find(x => x.n === pairName);
          const pairBm = bodyMeshes.find(b => b.name === pairName);
          if (pairS && pairBm) {
            pairS.sx = s.sx; pairS.sy = s.sy; pairS.sz = s.sz;
            pairBm.baseScale = { x: pairS.sx, y: pairS.sy, z: pairS.sz };
            pairBm.mesh.scale.set(pairS.sx, pairS.sy, pairS.sz);
          }
        }
      } else if (activeGizmoDrag.type === 'rotate') {
        const vStart = gizmoDragStartPoint.clone().sub(activeGizmoDrag.startGizmoPos);
        const vCurr = gizmoDragPlaneIntersect.clone().sub(activeGizmoDrag.startGizmoPos);
        let angle = 0;
        if (activeGizmoDrag.axis === 'x') {
          angle = -(Math.atan2(vCurr.y, vCurr.z) - Math.atan2(vStart.y, vStart.z));
        } else if (activeGizmoDrag.axis === 'y') {
          angle = -(Math.atan2(vCurr.z, vCurr.x) - Math.atan2(vStart.z, vStart.x));
        } else if (activeGizmoDrag.axis === 'z') {
          angle = Math.atan2(vCurr.y, vCurr.x) - Math.atan2(vStart.y, vStart.x);
        }
        const bm = bodyMeshes.find(b => b.name === s.n);
        if (bm) {
          const sr = activeGizmoDrag.startRot;
          if (activeGizmoDrag.axis === 'x') bm.mesh.rotation.x = sr.x + angle;
          else if (activeGizmoDrag.axis === 'y') bm.mesh.rotation.y = sr.y + angle;
          else if (activeGizmoDrag.axis === 'z') bm.mesh.rotation.z = sr.z + angle;
          s.rx = bm.mesh.rotation.x; s.ry = bm.mesh.rotation.y; s.rz = bm.mesh.rotation.z;
        }
      }

      if (typeof initBodyConnectors === 'function') initBodyConnectors();
      if (typeof initRigSkeleton === 'function') initRigSkeleton();
      updateSelectionGizmo();
    }
    return;
  }

  const dx = e.clientX - touchStartPos[0];
  const dy = e.clientY - touchStartPos[1];
  if (Math.hypot(dx, dy) > 8) {
    touchMoved = true;
    const isIsoOrModel = (typeof activeEngineState !== 'undefined' && (activeEngineState === 'MODEL' || activeEngineState === 'BUILD_ISO' || (activeEngineState === 'BUILD' && document.body.classList.contains('iso'))));
    if ((e.buttons === 2 || e.altKey || isIsoOrModel) && typeof camMode !== 'undefined' && (camMode === 'iso' || camMode === 'free')) {
      camAngle.yaw -= dx * 0.008;
      camAngle.pitch = Math.max(-1.48, Math.min(1.48, camAngle.pitch + dy * 0.008));
      updateCameraPosition();
      touchStartPos = [e.clientX, e.clientY];
    }
  }
});

// === 60-STEP MATHEMATICAL NODE EDIT UNDO / REDO SYSTEM ===
const ORIGINAL_SPHERES = JSON.parse(JSON.stringify(SPHERES));
const MAX_NODE_UNDO = 60;
const _nodeUndoStack = [];
const _nodeRedoStack = [];
let _pendingNodeDragSnap = null;

function _takeNodeSnapshot() {
  const snap = SPHERES.map(s => ({
    n: s.n, x: s.x, y: s.y, z: s.z, r: s.r, sx: s.sx, sy: s.sy, sz: s.sz,
    rx: s.rx || 0, ry: s.ry || 0, rz: s.rz || 0
  }));
  const rg = {};
  CONNECTOR_DEFS.forEach(d => { if (d.rings && d.rings.length) rg[d.parent + '>' + d.child] = d.rings.map(r => ({ t: r.t, k: r.k })); });
  snap.rings = rg;
  return snap;
}

function _applyNodeSnapshot(snap) {
  if (snap.rings) {
    CONNECTOR_DEFS.forEach(d => {
      const r = snap.rings[d.parent + '>' + d.child];
      if (r) d.rings = r.map(x => ({ t: x.t, k: x.k })); else delete d.rings;
    });
  }
  snap.forEach(saved => {
    const s = SPHERES.find(x => x.n === saved.n);
    const bm = bodyMeshes.find(b => b.name === saved.n);
    if (s && bm) {
      s.x = saved.x; s.y = saved.y; s.z = saved.z;
      s.r = saved.r;
      s.sx = saved.sx; s.sy = saved.sy; s.sz = saved.sz;
      bm.mesh.position.set(s.x, s.y, s.z);
      bm.baseScale = { x: s.sx, y: s.sy, z: s.sz };
      bm.mesh.scale.set(s.sx, s.sy, s.sz);
      s.rx = saved.rx || 0; s.ry = saved.ry || 0; s.rz = saved.rz || 0;
      bm.mesh.rotation.set(s.rx, s.ry, s.rz);
      bm.mesh.geometry.dispose();
      bm.mesh.geometry = new THREE.SphereGeometry(s.r, 24, 20);
    }
  });
  if (typeof initBodyConnectors === 'function') initBodyConnectors();
  if (typeof initRigSkeleton === 'function') initRigSkeleton();
  updateSelectionGizmo();
  const cur = SPHERES.find(x => x.n === selectedNodeName);
  if (cur && $('sheet') && $('sheet').classList.contains('s') && $('sheet-title').textContent.includes('Node Inspector')) {
    openNodeInspectorSheet(cur);
  }
}

function _pushNodeUndo(snapBefore) {
  if (!snapBefore) return;
  const cur = _takeNodeSnapshot();
  if (JSON.stringify(snapBefore) === JSON.stringify(cur) && JSON.stringify(snapBefore.rings || {}) === JSON.stringify(cur.rings || {})) return;
  _nodeUndoStack.push(snapBefore);
  if (_nodeUndoStack.length > MAX_NODE_UNDO) _nodeUndoStack.shift();
  _nodeRedoStack.length = 0;
  _updateUndoUI();
}

function _updateUndoUI() {
  const du = $('dock-undo'), dr = $('dock-redo');
  if (du) du.style.opacity = _nodeUndoStack.length ? '1' : '0.4';
  if (dr) dr.style.opacity = _nodeRedoStack.length ? '1' : '0.4';
  const uBtn = $('btn-node-undo');
  const rBtn = $('btn-node-redo');
  if (uBtn) {
    uBtn.disabled = _nodeUndoStack.length === 0;
    uBtn.textContent = `↶ Undo (${_nodeUndoStack.length})`;
    uBtn.style.opacity = _nodeUndoStack.length === 0 ? '0.45' : '1.0';
  }
  if (rBtn) {
    rBtn.disabled = _nodeRedoStack.length === 0;
    rBtn.textContent = `↷ Redo (${_nodeRedoStack.length})`;
    rBtn.style.opacity = _nodeRedoStack.length === 0 ? '0.45' : '1.0';
  }
}

function undoNodeEdit() {
  if (_nodeUndoStack.length === 0) { msg('Nothing to undo'); return; }
  _nodeRedoStack.push(_takeNodeSnapshot());
  const prev = _nodeUndoStack.pop();
  _applyNodeSnapshot(prev);
  _updateUndoUI();
  msg(`↶ Undone (${_nodeUndoStack.length} steps left)`);
}
window.undoNodeEdit = undoNodeEdit;

function redoNodeEdit() {
  if (_nodeRedoStack.length === 0) { msg('Nothing to redo'); return; }
  _nodeUndoStack.push(_takeNodeSnapshot());
  const next = _nodeRedoStack.pop();
  _applyNodeSnapshot(next);
  _updateUndoUI();

function _swapLR(n) {
  if (n.includes('L')) return n.replace('L', 'R');
  if (n.includes('R')) return n.replace('R', 'L');
  return n;
}
function _partnerDef(def) {
  if (window.EWS_mirrorOn === false) return null;
  const p = _swapLR(def.parent), c = _swapLR(def.child);
  if (p === def.parent && c === def.child) return null;
  return CONNECTOR_DEFS.find(d => d.parent === p && d.child === c) || null;
}
function _defOf(sr) { return sr && CONNECTOR_DEFS.find(d => d.parent === sr.parent && d.child === sr.child); }
function _rebuildConn(def) {
  const conn = bodyConnectors.find(c => c.def === def);
  if (!conn) return;
  conn.mesh.geometry.dispose();
  conn.mesh.geometry = createWeldedLoftGeometry(conn.rPv, conn.rCv, 24, def.rings);
}
function _rebuildWithPartner(def) { _rebuildConn(def); const p = _partnerDef(def); if (p) _rebuildConn(p); }

function setRingProp(prop, val) {
  const sr = window.selectedRing, def = _defOf(sr);
  if (!def || !def.rings || !def.rings[sr.idx]) return;
  const apply = (d) => {
    const rs = d.rings; if (!rs || !rs[sr.idx]) return;
    if (prop === 'k') rs[sr.idx].k = val;
    else {
      const lo = sr.idx > 0 ? rs[sr.idx - 1].t + 0.04 : 0.05;
      const hi = sr.idx < rs.length - 1 ? rs[sr.idx + 1].t - 0.04 : 0.95;
      rs[sr.idx].t = Math.min(hi, Math.max(lo, val));
    }
  };
  apply(def); const p = _partnerDef(def); if (p) apply(p);
  _rebuildWithPartner(def);
}

function _beginRingEdit(def, idx, snap) {

function ringToolTap(conn, worldPt) {
  if (window.ringEdit) return;
  const def = conn.def;
  const local = conn.mesh.worldToLocal(worldPt.clone());
  const t = Math.min(0.94, Math.max(0.06, local.y + 0.5));
  const snap = _takeNodeSnapshot();
  let existing = -1, bestD = 0.12;
  (def.rings || []).forEach((r, i) => { const d = Math.abs(r.t - t); if (d < bestD) { bestD = d; existing = i; } });
  if (existing >= 0) { _beginRingEdit(def, existing, snap); msg('⭕ Editing ring: drag to move it'); return; }
  const add = (d) => { d.rings = d.rings || []; d.rings.push({ t, k: 1.0 }); d.rings.sort((a, b) => a.t - b.t); return d.rings.findIndex(r => r.t === t); };
  const idx = add(def);
  const p = _partnerDef(def); if (p) add(p);
  _rebuildWithPartner(def);
  _beginRingEdit(def, idx, snap);
  msg('⭕ Ring placed: drag to slide it, then Accept');
}

function deleteRingEdit() {

// While a ring is being edited, ONE finger belongs to the ring. Navigation, selection, steering and
// pick-up never see it. Buttons (pill, revolver, orbs, sheet) still work normally.
function _ringScreenAxis() {
  const sr = window.selectedRing;
  const conn = sr && bodyConnectors.find(c => c.def.parent === sr.parent && c.def.child === sr.child);
  if (!conn) return null;
  const toPx = (m) => { const v = m.getWorldPosition(new THREE.Vector3()).project(camera);
    return { x: (v.x * 0.5 + 0.5) * window.innerWidth, y: (-v.y * 0.5 + 0.5) * window.innerHeight }; };
  return { a: toPx(conn.child.mesh), b: toPx(conn.parent.mesh) };
}
function _ringEditPointer(e) {
  const re = window.ringEdit; if (!re) return;
  if (e.target.closest && e.target.closest('#ring-pill, #revolver, #sheet, .orb, .modal')) return;
  e.stopImmediatePropagation();
  if (e.cancelable) e.preventDefault();
  const sr = window.selectedRing, def = _defOf(sr), ring = def && def.rings && def.rings[sr.idx];
  if (!ring) return;
  if (e.type === 'pointerdown') {
    if (re.pid != null) return;
    re.pid = e.pointerId; re.x0 = e.clientX; re.y0 = e.clientY; re.t0 = ring.t; re.k0 = ring.k;
    re.ax = _ringScreenAxis();
  } else if (e.type === 'pointermove' && e.pointerId === re.pid) {
    const dx = e.clientX - re.x0, dy = e.clientY - re.y0;
    if (re.mode === 'slide') {
      let dt;
      const ax = re.ax;
      const abx = ax ? ax.b.x - ax.a.x : 0, aby = ax ? ax.b.y - ax.a.y : 0, L2 = abx * abx + aby * aby;
      if (L2 < 1600) dt = -dy / 300;                 // tube points at the camera: use up/down
      else dt = (dx * abx + dy * aby) / L2;          // along the tube on screen (child 0 -> parent 1)
      setRingProp('t', re.t0 + dt);
    } else {
      setRingProp('k', Math.min(1.8, Math.max(0.3, re.k0 * Math.exp(-dy / 220))));
    }

  }
}

function updateNodeProperty(name, prop, val) {
  const s = SPHERES.find(x => x.n === name);
  if (!s) return;
  s[prop] = val;

  const bm = bodyMeshes.find(b => b.name === name);
  if (bm) {
    if (prop === 'r') {
      bm.mesh.geometry.dispose();
      bm.mesh.geometry = new THREE.SphereGeometry(val, 24, 20);
    } else if (prop === 'x' || prop === 'y' || prop === 'z') {
      bm.mesh.position[prop] = val;
    } else if (prop === 'sx' || prop === 'sy' || prop === 'sz') {
      const axis = prop === 'sx' ? 'x' : (prop === 'sy' ? 'y' : 'z');
      bm.baseScale[axis] = val;
      bm.mesh.scale[axis] = val;
    }
  }

  // Symmetrical mirror updates for L/R pairs
  if (window.EWS_mirrorOn !== false && (name.includes('L') || name.includes('R'))) {
    const pairName = name.includes('L') ? name.replace('L', 'R') : name.replace('R', 'L');
    const pairS = SPHERES.find(x => x.n === pairName);
    const pairBm = bodyMeshes.find(b => b.name === pairName);
    if (pairS && pairBm) {
      if (prop === 'r') {
        pairS.r = val;
        pairBm.mesh.geometry.dispose();
        pairBm.mesh.geometry = new THREE.SphereGeometry(val, 24, 20);
      } else if (prop === 'x' || prop === 'y') {
        pairS[prop] = val;
        pairBm.mesh.position[prop] = val;
      } else if (prop === 'z') {
        pairS.z = -val;
        pairBm.mesh.position.z = -val;
      } else if (prop === 'sx' || prop === 'sy' || prop === 'sz') {
        const axis = prop === 'sx' ? 'x' : (prop === 'sy' ? 'y' : 'z');
        pairS[prop] = val;
        pairBm.baseScale[axis] = val;
        pairBm.mesh.scale[axis] = val;
      }
    }
  }

  if (typeof initBodyConnectors === 'function') initBodyConnectors();
  if (typeof initRigSkeleton === 'function') initRigSkeleton();
  updateSelectionGizmo();
}
window.updateNodeProperty = updateNodeProperty;


window.addEventListener('pointerup', e => {
  if (activeGizmoDrag) {
    if (gizmoStartSnapshot) {
      _pushNodeUndo(gizmoStartSnapshot);
      gizmoStartSnapshot = null;
    }
    const s = SPHERES.find(x => x.n === activeGizmoDrag.nodeName);
    if (s) {
      msg(`✨ Transformed ${s.n}: pos=(${s.x.toFixed(2)}, ${s.y.toFixed(2)}, ${s.z.toFixed(2)}) scale=(${s.sx.toFixed(2)}, ${s.sy.toFixed(2)}, ${s.sz.toFixed(2)})`);
    }
    activeGizmoDrag = null;
    return;
  }

  if (e.target.closest('#revolver, #sheet, .orb, #st3dframe, .modal')) return;
  if (window.EWS_rag && window.EWS_rag.state) return;
  if (window.EWS_steer && window.EWS_steer.steering) return;

  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  if (!touchMoved) {
    // Collect all pickable targets (body meshes + skeleton joint markers)
    const pickTargets = [...characterGroup.children];
    if (jointMarkers && jointMarkers.length) {
      jointMarkers.forEach(jm => { if (jm.marker) pickTargets.push(jm.marker); });
    }
    let ponyHits = raycaster.intersectObjects(pickTargets, true);
    // hidden parts (organs, bones, ghosts) must not catch taps
    ponyHits = ponyHits.filter(h => { for (let o = h.object; o; o = o.parent) { if (o.visible === false) return false; } return !(h.object.material && h.object.material.visible === false); });

    // Scent Marking / 3D Affordance Target Picking
    if (ACTION_DIRECTOR.pickingTarget) {
      const propHits = raycaster.intersectObjects([treeTrunk, drainGrate, ruinGroup], true);
      if (propHits.length > 0) {
        const hit = propHits[0];
        let snapPt = hit.point.clone();
        if (hit.object === treeTrunk || hit.object.name === 'prop_tree') {
          snapPt.y = 0.25;
          msg('🎯 Snapped target to Lower Tree Trunk Base');
        } else if (hit.object === drainGrate || hit.object.name === 'prop_drain') {
          snapPt.y = 0.02;
          msg('🎯 Snapped target to Waste Drain Grate');
        } else {
          snapPt.y = 0.25;
          msg('🎯 Snapped target to Ruin Wall Base');
        }
        ACTION_DIRECTOR.targetPos.copy(snapPt);
        scentTargetMarker.position.set(snapPt.x, 0.02, snapPt.z);
        scentTargetMarker.visible = true;
        ACTION_DIRECTOR.pickingTarget = false;
        updateDirectorStatus();
        return;
      }
      const gHits = raycaster.intersectObject(groundMesh);
      if (gHits.length > 0) {
        const snapPt = gHits[0].point.clone();
        ACTION_DIRECTOR.targetPos.copy(snapPt);
        scentTargetMarker.position.set(snapPt.x, 0.02, snapPt.z);
        scentTargetMarker.visible = true;
        ACTION_DIRECTOR.pickingTarget = false;
        msg(`🎯 Scent target set to Ground Spot (${snapPt.x.toFixed(1)}, ${snapPt.z.toFixed(1)})`);
        updateDirectorStatus();
        return;
      }
    }

    // Direct 3D Node & Joint Picking on Mobile / Touch Screen
    if (ponyHits.length > 0 && (activeEngineState === 'SELECT' || activeEngineState === 'EDIT' || activeEngineState === 'MODEL' || activeEngineState === 'BUILD_ISO' || activeEngineState === 'BUILD')) {
      if (window.ringToolOn) {
        for (let h of ponyHits) {
          const rc = bodyConnectors.find(c => c.mesh === h.object);
          if (rc) { ringToolTap(rc, h.point); return; }
          if ((h.object.userData && h.object.userData.isJointMarker) || bodyMeshes.find(b => b.mesh === h.object)) break;
        }
      }
      let hitNodeName = null;
      for (let h of ponyHits) {
        if (h.object && h.object.userData && h.object.userData.isJointMarker) {
          hitNodeName = h.object.userData.nodeName;
          break;
        }
        const bm = bodyMeshes.find(b => b.mesh === h.object);
        if (bm) { hitNodeName = bm.name; break; }
        const cn = bodyConnectors.find(c => c.mesh === h.object);
        if (cn) {
          const pw = new THREE.Vector3(), cw = new THREE.Vector3();
          cn.parent.mesh.getWorldPosition(pw); cn.child.mesh.getWorldPosition(cw);
          hitNodeName = (h.point.distanceTo(pw) <= h.point.distanceTo(cw)) ? cn.parent.name : cn.child.name;
          break;
        }
      }
      if (hitNodeName) {
        if (window.multiMode && typeof multiToggle === 'function') multiToggle(hitNodeName); else selectBodyNode(hitNodeName);
        return;
      }
    }

    if (ponyHits.length === 0 && (activeEngineState === 'SELECT' || activeEngineState === 'EDIT' || activeEngineState === 'MODEL' || activeEngineState === 'BUILD_ISO')) {
      if (window.multiMode) return;
      selHalo.visible = false; gizmoGroup.visible = false; sheet.classList.remove('s'); msg('Deselected'); return;
    }

    if (activeEngineState === 'BUILD') {
      if (ponyHits.length === 0) { selHalo.visible = false; gizmoGroup.visible = false; }
      const groundHits = raycaster.intersectObject(groundMesh);
      if (groundHits.length > 0) {
        paintDesignationTile(groundHits[0].point.x, groundHits[0].point.z, activePaintTool);
      }
    } else if (activeEngineState === 'LIVE' || activeEngineState === 'ANIMATE') {
      const groundHits = raycaster.intersectObject(groundMesh);
      if (groundHits.length > 0) {
        setWalkDestination(groundHits[0].point);
      } else if (ponyHits.length > 0) {
        setWalkDestination({ x: ponyHits[0].point.x, z: ponyHits[0].point.z });
      }
    }
  } else {
    // Clicking off into nothing with finger clears selection and closes open sheets
    if (sheet && sheet.classList.contains('s')) {
      sheet.classList.remove('s');
      msg('Deselected');
    }
  }
});

const PARTICLE_COUNT = 600;
const partGeo = new THREE.BufferGeometry();
const partPositions = new Float32Array(PARTICLE_COUNT * 3);
const partVels = new Float32Array(PARTICLE_COUNT * 3);

for (let i = 0; i < PARTICLE_COUNT; i++) {
  partPositions[i * 3 + 0] = (Math.random() - 0.5) * 24;
  partPositions[i * 3 + 1] = Math.random() * 14;
  partPositions[i * 3 + 2] = (Math.random() - 0.5) * 24;
  partVels[i * 3 + 0] = (Math.random() - 0.5) * 0.2;
  partVels[i * 3 + 1] = -5.0 - Math.random() * 8.0; // downward fall
  partVels[i * 3 + 2] = (Math.random() - 0.5) * 0.2;
}
partGeo.setAttribute('position', new THREE.BufferAttribute(partPositions, 3));

const partMat = new THREE.PointsMaterial({
  color: 0x7fc2a5,
  size: 0.14,
  transparent: true,
  opacity: 0.65,
  depthWrite: false
});

let currentWeatherType = 'rain'; // 'rain' (acid), 'snow', 'dust'

function setWeatherType(type) {
  currentWeatherType = type;
  if (type === 'rain') {
    partMat.color.setHex(0x7fc2a5);
    partMat.size = 0.14;
    partMat.opacity = 0.65;
  } else if (type === 'snow') {
    partMat.color.setHex(0xffffff);
    partMat.size = 0.20;
    partMat.opacity = 0.85;
  } else if (type === 'dust') {
    partMat.color.setHex(0xc9a973);
    partMat.size = 0.16;
    partMat.opacity = 0.45;
  }
}

let lastSplatTime = 0;
function updateWeatherSystem(dt) {
  const p = characterGroup.position;
  const pos = partPositions;
  const isRain = currentWeatherType === 'rain';
  const isSnow = currentWeatherType === 'snow';
  const fallSpeed = isSnow ? 1.8 : (isRain ? 14.0 : 2.5);

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const idx = i * 3;
    pos[idx + 1] -= fallSpeed * dt;
    if (isSnow) pos[idx + 0] += Math.sin(pos[idx + 1] * 2) * dt * 0.4;

    // Wrap around character/camera volume
    if (pos[idx + 1] <= 0.05) {
      if (isRain && Math.random() < 0.03 && performance.now() - lastSplatTime > 40) {
        addSplat(pos[idx + 0], pos[idx + 2], 0.35, 'rain');
        lastSplatTime = performance.now();
      }
      pos[idx + 1] = 13.0;
      pos[idx + 0] = p.x + (Math.random() - 0.5) * 24;
      pos[idx + 2] = p.z + (Math.random() - 0.5) * 24;
    }
  }
  partGeo.attributes.position.needsUpdate = true;

  // Dynamic Fur Wetness Sheen
  if (isRain && simSpeed > 0) {
    ponyMat.roughness = Math.max(0.18, ponyMat.roughness - dt * 0.05);
  } else {
    ponyMat.roughness = Math.min(0.72, ponyMat.roughness + dt * 0.02);
  }
}

let _frameCount = 0;
function _safe(label, fn) {

    const k = label + ': ' + err.message;
    if (!_frameErrSeen[k]) {
      _frameErrSeen[k] = 1;
      console.error('EWS step failed [' + label + ']', err);

      renderer.setSize(window.innerWidth, window.innerHeight);

      const sunAngle = (simSec / 43200) * Math.PI;
      celestialLight.position.set(Math.cos(sunAngle) * 8, Math.sin(sunAngle) * 8 + 2, 4);
    });
  }

  _safe('camera', () => {

  _safe('modelLight', updateModelLight);
  _safe('multiOutline', updateMultiOutlines);
  _safe('bottomBar', updateBottomBar);
  _safe('render', () => renderer.render(scene, camera));

  _frameCount++;
  if (_frameCount === 240 && renderer.info.render.calls < 2) {
    msg('⚠ Nothing was drawn to the 3D view - read the ⚠ messages above');
  }
}

  try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(json).catch(() => {}); } catch (e) {}
  const fallback = () => {
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
      a.download = name; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      msg('⬇️ Saved ' + name + ' (also copied to clipboard)');

  };
  try {

      navigator.share({ files: [file], title: 'EWS base model' })

// Apply nodes (creating any missing ones) + their connector links, with undo
function _applyRigNodes(nodes, links) {
  const snap = _takeNodeSnapshot();
  Object.keys(nodes).forEach(k => {
    const it = nodes[k];
    let sp = SPHERES.find(x => x.n === k);
    if (!sp) {
      sp = { n: k, x: 0, y: 0.5, z: 0, r: 0.14, sx: 1, sy: 1, sz: 1 };
      SPHERES.push(sp);
      const mesh = new THREE.Mesh(new THREE.SphereGeometry(sp.r, 24, 20), ponyMat);
      mesh.castShadow = true; characterGroup.add(mesh);
      bodyMeshes.push({ name: k, mesh, baseScale: { x: 1, y: 1, z: 1 } });
    }
    if (it.pos) { sp.x = it.pos[0]; sp.y = it.pos[1]; sp.z = it.pos[2]; }
    if (it.r) sp.r = it.r;
    if (it.scale) { sp.sx = it.scale[0]; sp.sy = it.scale[1]; sp.sz = it.scale[2]; }
    if (it.rot) { sp.rx = it.rot[0]; sp.ry = it.rot[1]; sp.rz = it.rot[2]; }
    const bm = bodyMeshes.find(b => b.name === k);
    if (bm) {
      bm.mesh.position.set(sp.x, sp.y, sp.z);
      bm.baseScale = { x: sp.sx, y: sp.sy, z: sp.sz };
      bm.mesh.scale.set(sp.sx, sp.sy, sp.sz);
      bm.mesh.rotation.set(sp.rx || 0, sp.ry || 0, sp.rz || 0);
      bm.mesh.geometry.dispose();
      bm.mesh.geometry = new THREE.SphereGeometry(sp.r, 24, 20);
    }
  });
  if (Array.isArray(links) && links.length) {
    CONNECTOR_DEFS.length = 0;
    links.forEach(l => {
      const d = { parent: l.parent, child: l.child, rP: l.rP, rC: l.rC };
      if (Array.isArray(l.rings) && l.rings.length) d.rings = l.rings.map(r => ({ t: +r.t, k: +r.k }));
      CONNECTOR_DEFS.push(d);
    });
  }
  if (typeof initBodyConnectors === 'function') initBodyConnectors();
  if (typeof initRigSkeleton === 'function') initRigSkeleton();
  updateSelectionGizmo();
  _pushNodeUndo(snap);
}

    } else if (data.target && (data.pos || data.scale || data.r)) {
      const s = SPHERES.find(x => x.n === data.target);
      if (s) {
        if (data.pos) { s.x = data.pos[0]; s.y = data.pos[1]; s.z = data.pos[2]; }
        if (data.r) s.r = data.r;
        if (data.scale) { s.sx = data.scale[0]; s.sy = data.scale[1]; s.sz = data.scale[2]; }
        const bm = bodyMeshes.find(b => b.name === data.target);

let activePaintTool = 'mine'; // 'mine', 'stockpile', 'clear'

const desMineMat = new THREE.MeshBasicMaterial({ color: 0xffa500, transparent: true, opacity: 0.45, side: THREE.DoubleSide });

function paintDesignationTile(worldX, worldZ, tool) {
  const gx = Math.round(worldX / TILE_SIZE);
  const gz = Math.round(worldZ / TILE_SIZE);
  const key = `${gx},${gz}`;

  if (tool === 'clear') {
    if (DESIGNATION_TILES.has(key)) {
      const entry = DESIGNATION_TILES.get(key);
      scene.remove(entry.mesh);
      if (entry.mesh.geometry) entry.mesh.geometry.dispose();
      DESIGNATION_TILES.delete(key);
      msg(`Cleared designation at (${gx}, ${gz})`);
    }
    return;
  }

  if (DESIGNATION_TILES.has(key)) {
    const entry = DESIGNATION_TILES.get(key);
    entry.type = tool;
    entry.mesh.material = (tool === 'mine' ? desMineMat : desStockMat);
    return;
  }

  const mat = tool === 'mine' ? desMineMat : desStockMat;
  const tileMesh = new THREE.Mesh(desGeo, mat);
  tileMesh.position.set(gx * TILE_SIZE, 0.018, gz * TILE_SIZE);
  scene.add(tileMesh);
  DESIGNATION_TILES.set(key, { type: tool, mesh: tileMesh, hp: 100 });
  msg(`Designated ${tool.toUpperCase()} at (${gx}, ${gz})`);
}

    if (e.type === 'pointerup' || e.type === 'pointercancel') { B.pid = null; B.last = null; saveDabs(); return; }
    var h = pickScreen(e.clientX, e.clientY); if (!h) return;
    var R = radius(e);
    if (B.last && B.last.distanceTo(h.point) < R * 0.3) return;
    B.last = h.point.clone(); stamp(h, R, B.sid);
  }
  ['pointerdown', 'pointermove', 'pointerup', 'pointercancel'].forEach(function(t){ window.addEventListener(t, brushPointer, true); });

  /* ---------- sheet ---------- */
  window.openPaintSheet = function(){
    var sw = ['#d0c0a8','#f2e6d6','#e8a9a0','#3b2e27','#8a6a4a','#b84a5e','#6e8276','#d96a6a'].map(function(h){
      return '<button class="ctrl" style="min-width:38px;min-height:38px;background:'+h+'" onclick="paintSetColor(\''+h+'\');document.getElementById(\'pt-col\').value=\''+h+'\'"></button>'; }).join('');
    function sl(l, mn, mx, st, v, fn){ return '<div style="font-size:12px;opacity:.85;margin-top:6px">'+l+'</div><input type="range" min="'+mn+'" max="'+mx+'" step="'+st+'" value="'+v+'" oninput="'+fn+'(this.value)" style="width:100%">'; }
    openSheet('Paint', ''
      + '<div class="row"><button class="ctrl on" style="flex:1;min-height:48px;font-weight:700" onclick="paintBrushOn()">🖌️ Start Brush (paint on the surface)</button></div>'
      + sl('Brush size (metres)', 0.004, 0.15, 0.002, B.R, 'paintSetSize') + sl('Softness (right = harder edge)', 0.05, 1, 0.05, B.hard, 'paintSetHard') + sl('Strength', 0.1, 1, 0.05, B.alpha, 'paintSetAlpha')
      + '<div style="font-size:12px;opacity:.85;margin:8px 0 4px">Colour</div>'
      + '<div class="row" style="align-items:center"><input type="color" id="pt-col" value="'+col+'" oninput="paintSetColor(this.value)" style="width:54px;height:40px;border:0;background:none">' + sw + '</div>'
      + '<div class="row"><button class="ctrl" style="flex:1" onclick="paintUndo()">↶ Undo stroke</button><button class="ctrl" style="flex:1" onclick="paintCopyStrokes()">📋 Copy paint</button><button class="ctrl" style="flex:1" onclick="paintClearStrokes()">🗑 Clear strokes</button></div>'
      + '<div class="row"><button class="ctrl '+(mirrorOn?'on':'')+'" style="flex:1" onclick="paintToggleMirror()">Mirror L/R: '+(mirrorOn?'ON':'OFF')+'</button></div>'
      + '<div style="font-size:12px;opacity:.85;margin:10px 0 4px">Whole-part colour</div>'
      + '<div class="row"><button class="ctrl on" style="flex:1" onclick="paintHooves()">🥾 4 Hooves</button><button class="ctrl on" style="flex:1" onclick="paintFace()">👤 Soft Face</button><button class="ctrl on" style="flex:1" onclick="paintCoatReset()">🐴 Coat reset</button></div>'
      + '<div class="row"><button class="ctrl" style="flex:1" onclick="paintSelected()">🖌️ Colour selected part</button><button class="ctrl '+(tapPaint?'on':'')+'" style="flex:1" onclick="paintToggleTap()">Tap-to-Colour: '+(tapPaint?'ON':'OFF')+'</button></div>');
  };

  /* ---------- 1-Tap Paste Clip ---------- */
  window.pasteClip = async function(){
    var t = '';
    try { t = await navigator.clipboard.readText(); }
    catch(e){ msg('Clipboard blocked: opening the paste box'); if (window.openInjectModal) openInjectModal(); return; }
    t = (t || '').trim().replace(/^```[a-z]*\s*/i, '').replace(/```\s*$/, '').trim();
    var a = t.indexOf('{'), b = t.lastIndexOf('}');
    if (!t) { msg('Clipboard is empty'); return; }
    if (a < 0 || b <= a) { msg('No JSON found on the clipboard'); return; }
    var obj; try { obj = JSON.parse(t.slice(a, b + 1)); } catch(e){ msg('Clipboard JSON is broken: ' + String(e.message).slice(0, 60)); return; }
    var only = Object.keys(obj).every(function(k){ return k === 'paint' || k === 'paintStrokes'; });
    if (obj.paint && typeof obj.paint === 'object') window.paintApplyMap(obj.paint);
    if (Array.isArray(obj.paintStrokes)) {
      var s0 = ++sidN; obj.paintStrokes.forEach(function(a2){ var d = unpack(a2); d.s = s0; DABS.push(d); COUNT[d.k] = (COUNT[d.k] || 0) + 1; if (PS[d.k]) PS[d.k].dirty = true; });
      saveDabs();
    }
    if (obj.paint || obj.paintStrokes) msg('Paint applied from clipboard');
    if (only) return;
    injectAIMathPacket(JSON.stringify(obj));
  };
})();
</script>
